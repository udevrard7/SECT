name: tts3-logs (temporaire — diagnostic)
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Diag edge-tts complet dans le conteneur
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            echo '═══ edge-tts direct (texte court) — traceback COMPLET ═══'
            docker exec sect-api edge-tts --voice fr-FR-HenriNeural --text "Bonjour, ceci est un test." --write-media /tmp/diag.mp3 2>&1 | tail -30
            echo "exit=$?"
            echo '═══ fichier produit ? ═══'
            docker exec sect-api sh -c 'ls -la /tmp/diag.mp3 2>&1; head -c 4 /tmp/diag.mp3 2>/dev/null | od -An -tx1'
            echo '═══ logs TTS complets (2h) ═══'
            docker logs sect-api --since 2h 2>&1 | grep -iE 'TTS|podcast' | tail -40
