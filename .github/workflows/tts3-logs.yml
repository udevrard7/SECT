name: tts3-logs (temporaire — diagnostic)
on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Diag échec Voxtral premium (logs complets)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            echo '═══ Toutes les lignes Voxtral (15 dernières minutes) ═══'
            docker logs sect-api --since 15m 2>&1 | grep -iE 'voxtral' | tail -20
            echo '═══ extraConfig du provider TTS (URLs seules, jamais les clés) ═══'
            cd /opt/sect
            NEON=$(grep '^NEON_DIRECT_URL=' .env | cut -d= -f2- | tr -d '\r')
            psql "$NEON" -t -A -c "SELECT \"extraConfig\" FROM \"AIProviderConfig\" WHERE \"provider\"='VOXTRAL' AND \"isActive\"=true"
