# ============================================================
# SECT-LATENCY-4 — Benchmark modèles OpenRouter (prompt QCM réel)
#
# CONTEXTE (mesure 20:07) : kimi-k2.6 répond en 6,2 s à un essai
# puis >15 s au suivant (files partagées variables). Le landing-demo
# a besoin d'un modèle RAPIDE ET STABLE en français (QCM ~400 tokens).
#
# MESURE (lecture seule + ~12 appels chat de test) :
#   1. Clé OpenRouter lue en base (NEON_DIRECT) — jamais affichée ;
#   2. GET /api/v1/models → slugs candidats réels (kimi-k2.6 référence,
#      llama-3.3-70b, gemini-flash, qwen3, deepseek-chat + :free) ;
#   3. Pour chaque slug : 2 essais avec un prompt QCM équivalent au
#      landing-demo (max_tokens 4096) — http/TTFB/total/mots/validité ;
#   4. Validité : la réponse contient "question" + "options".
#
# DÉCISION ensuite assistée : changer "model" du provider
# openrouter-provider-001 (UPDATE réversible) si un candidat domine
# kimi-k2.6 sur la stabilité.
#
# Pièges respectés (ADR §18.5) : PAS de else/elif sous script_stop
# (piège n°7) ; scripts Python via base64 (pattern maison — heredoc
# indenté = SyntaxError Python) ; clé dans une variable, jamais echo ;
# if…then…fi seuls ; dollar-quoting psql pour les littéraux.
# ============================================================
name: Benchmark modèles OpenRouter

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bench:
    name: "🏁 QCM réel × candidats (mesure)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: SSH OCI — benchmark modèles (egress VM)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          command_timeout: 11m
          script: |
            set -euo pipefail
            PGB=/usr/lib/postgresql/18/bin
            NEON_DIRECT=$(grep '^NEON_DIRECT_URL=' /opt/sect/.env | head -1 | cut -d= -f2-)
            if [ -z "$NEON_DIRECT" ]; then
              echo "ÉCHEC : NEON_DIRECT_URL absent de /opt/sect/.env"
              exit 1
            fi
            KEY=$("$PGB/psql" "$NEON_DIRECT" -tAc 'SELECT COALESCE("apiKey", $q$$q$) FROM "AIProviderConfig" WHERE "id" = $q$openrouter-provider-001$q$' | xargs)
            if [ -z "$KEY" ]; then
              KEY=$("$PGB/psql" "$NEON_DIRECT" -tAc 'SELECT COALESCE("extraConfig"->>$q$apiKey$q$, $q$$q$) FROM "AIProviderConfig" WHERE "id" = $q$openrouter-provider-001$q$' | xargs)
            fi
            if [ -z "$KEY" ]; then
              echo "ÉCHEC : clé OpenRouter introuvable en base"
              exit 1
            fi
            echo "Clé chargée (masquée, longueur ${#KEY})."

            echo "── 1. Slugs candidats accessibles (GET /models) ──"
            curl -s --max-time 15 -H "Authorization: Bearer $KEY" https://openrouter.ai/api/v1/models -o /tmp/orm.json
            echo '' | base64 -d > /tmp/cand.py
            python3 /tmp/cand.py > /tmp/candidates.txt
            N=$(wc -l < /tmp/candidates.txt)
            echo "Candidats trouvés : $N"
            sed 's/^/  - /' /tmp/candidates.txt
            if [ "$N" = "0" ]; then
              echo "ÉCHEC : aucun candidat trouvé dans /models (réponse API inattendue ?)"
              head -c 300 /tmp/orm.json
              exit 1
            fi

            echo "── 2. Prompt QCM (équivalent landing-demo) ×2 par modèle ──"
                        echo '' | base64 -d > /tmp/qcm_req.py
            echo '' | base64 -d > /tmp/parse.py

            while IFS= read -r MODEL; do
              [ -n "$MODEL" ] || continue
              for TRY in 1 2; do
                python3 /tmp/qcm_req.py "$MODEL" > /tmp/req.json
                curl -s -o /tmp/resp.json -w "$(printf '%-48s essai %s : http=%%{http_code} ttfb_s=%%{time_starttransfer} total_s=%%{time_total}' "$MODEL" "$TRY")" \
                  --max-time 45 -X POST https://openrouter.ai/api/v1/chat/completions \
                  -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                  -d @/tmp/req.json || echo "  $MODEL essai $TRY : ÉCHEC curl exit $?"
                echo ""
                python3 /tmp/parse.py 2>/dev/null || echo "    (réponse non parsable)"
                sleep 2
              done
            done < /tmp/candidates.txt

            rm -f /tmp/req.json /tmp/resp.json /tmp/orm.json /tmp/candidates.txt /tmp/cand.py /tmp/qcm_req.py /tmp/parse.py
            echo "── Fin du benchmark (UPDATE réversible du modèle si un candidat domine kimi-k2.6) ──"
