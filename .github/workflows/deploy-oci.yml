# ============================================================
# SECT-OCI-HYBRID-1 — CI/CD backend → VM OCI Marseille (primaire)
#
# 1. build   : image Docker multi-arch (linux/arm64 pour l'Ampere A1 +
#              linux/amd64 pour le debug/local) → GHCR
# 2. deploy  : SSH sur la VM → docker compose pull && up -d
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   OCI_SSH_HOST  — IP publique de la VM (ex. 132.x.x.x)
#   OCI_SSH_USER  — utilisateur SSH (ex. ubuntu ou opc)
#   OCI_SSH_KEY   — clé privée OpenSSH autorisée sur la VM
#
# Tant que ces secrets ne sont pas posés, le job deploy est SKIPPÉ
# (le build reste vert — la porte `gate` ci-dessous).
#
# Render continue de builder son côté (render.yaml, autoDeploy) —
# c'est le STANDBY : ne pas toucher à son workflow.
# ============================================================
name: Deploy backend to OCI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------
  # Porte : les secrets SSH sont-ils configurés ? (permet au workflow
  # d'atterrir vert avant l'onboarding de la VM, sans faille)
  # ------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.OCI_SSH_HOST }}" ] && [ -n "${{ secrets.OCI_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets présents — deploy OCI activé"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets absents — deploy OCI SKIPPÉ (build seulement)"
          fi

  # ------------------------------------------------------------
  # Build multi-arch + push GHCR
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nom d'image (repo lowercased — requis par GHCR)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/sect-api" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (build ARM64 sur runner AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64 + linux/amd64)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # SECT-OCI-DEPLOY-3 : PAS de cache GHA — le backend type=gha ne scope
          # pas les plateformes en multi-arch et a servi des layers amd64 à la
          # cible arm64 (binaire x86-64 dans une image linux/arm64 → exec
          # format error sur l'Ampere A1, preuve ELF e_machine=0x3E). Build
          # sans cache ≈ 2 min (cross-compile native, QEMU seulement sur les
          # stages alpine triviaux) : la correction prime sur la vitesse.
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # Deploy SSH sur la VM OCI
  # ------------------------------------------------------------
  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: oci-production
    steps:
      # SECT-INFRA-MONITOR-1 : le compose évolue dans le dépôt (montage ro du
      # staging backup /var/lib/sect-backup → /state/backup) — il est
      # synchronisé AVANT le up -d (le compose VM dérivait sinon au fil des
      # déploiements, comme la grille fixe 172.28.0.0/24 de la phase 3).
      - name: Checkout (compose à synchroniser)
        uses: actions/checkout@v4
      - name: Sync docker-compose.yml vers la VM
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "deploy/oci/docker-compose.yml"
          target: "/tmp/sect-compose-sync"
      - name: Deploy sur la VM (pull + up)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          # SECT-INFRA-MONITOR-1 : la clé Neon passe par envs (jamais
          # interpolée dans le corps du script — pattern secrets).
          envs: NEON_API_KEY_SECRET
          script: |
            set -euo pipefail
            cd /opt/sect
            # SECT-INFRA-MONITOR-1 : compose synchronisé depuis le dépôt
            # (scp ci-dessus) — remplacé AVANT le up -d.
            mv -f /tmp/sect-compose-sync/deploy/oci/docker-compose.yml /opt/sect/docker-compose.yml
            rm -rf /tmp/sect-compose-sync
            # L'image par digest exact (immutabilité du déploiement)
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}|" .env 2>/dev/null || true
            # ADR-0013 §13 — plancher jour 15 min (décision exploitant, 10/10/2026).
            # SEED-ONCE : posé seulement s'il n'existe pas déjà dans .env ;
            # une valeur posée/modifiée à la main sur la VM n'est JAMAIS écrasée.
            grep -q '^WORKER_DAY_MIN_INTERVAL=' .env || \
              printf '# ADR-0013 §13 : plancher jour 15 min (décision exploitant 10/10/2026)\nWORKER_DAY_MIN_INTERVAL=15m\n' >> .env
            # SECT-INFRA-MONITOR-1 : control plane Neon (onglet Infrastructure
            # de /monitoring) — SEED-ONCE, et UNIQUEMENT si le secret GitHub
            # NEON_API_KEY est posé non vide (vide = section « non configurée »
            # côté console, jamais un seed vide qui verrouillerait la valeur).
            if [ -n "${NEON_API_KEY_SECRET:-}" ] && ! grep -q '^NEON_API_KEY=' .env; then
              printf '# SECT-INFRA-MONITOR-1 : monitoring infra (control plane — ne réveille pas le compute)\nNEON_API_KEY=%s\nNEON_PROJECT_ID=autumn-rain-10233998\n' "$NEON_API_KEY_SECRET" >> .env
            fi
            # SECT-INFRA-MONITOR-1 : staging backup lisible par l'utilisateur
            # du conteneur (sect — non root). Uniquement timestamps + markers
            # mensuels : zéro secret. Le dir avait été créé 750 pendant l'ère
            # User=postgres du service (mesuré : permission denied run 38158907538).
            sudo -n chmod 0755 /var/lib/sect-backup 2>/dev/null || true
            sudo -n chmod a+r /var/lib/sect-backup/last_success /var/lib/sect-backup/restore-ok-* 2>/dev/null || true
            docker compose pull api
            docker compose up -d --remove-orphans
            docker image prune -f
            # Attendre le healthcheck (30s max) puis vérifier
            for i in $(seq 1 15); do
              if docker compose ps api | grep -q "healthy"; then
                echo "OK — api healthy"
                exit 0
              fi
              sleep 2
            done
            echo "ERREUR — api pas healthy après 30s"
            docker compose logs --tail 50 api
            exit 1
        env:
          NEON_API_KEY_SECRET: ${{ secrets.NEON_API_KEY }}

      - name: Smoke test public (/health)
        run: |
          sleep 5
          curl -fsS --max-time 20 "https://${{ vars.OCI_API_DOMAIN || 'api.sect.ftci.fr' }}/health" \
            && echo " — API OCI opérationnelle"
