# ============================================================
# SECT-OCI-HYBRID-1 — CI/CD backend → VM OCI Marseille (primaire)
#
# 1. build   : image Docker multi-arch (linux/arm64 pour l'Ampere A1 +
#              linux/amd64 pour le debug/local) → GHCR
# 2. deploy  : SSH sur la VM → docker compose pull && up -d
#
# Secrets GitHub requis (Settings → Secrets and variables → Actions) :
#   OCI_SSH_HOST  — IP publique de la VM (ex. 132.x.x.x)
#   OCI_SSH_USER  — utilisateur SSH (ex. ubuntu ou opc)
#   OCI_SSH_KEY   — clé privée OpenSSH autorisée sur la VM
#
# Tant que ces secrets ne sont pas posés, le job deploy est SKIPPÉ
# (le build reste vert — la porte `gate` ci-dessous).
#
# Render continue de builder son côté (render.yaml, autoDeploy) —
# c'est le STANDBY : ne pas toucher à son workflow.
# ============================================================
name: Deploy backend to OCI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/oci/**'
      - '.github/workflows/deploy-oci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ------------------------------------------------------------
  # Porte : les secrets SSH sont-ils configurés ? (permet au workflow
  # d'atterrir vert avant l'onboarding de la VM, sans faille)
  # ------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.OCI_SSH_HOST }}" ] && [ -n "${{ secrets.OCI_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets présents — deploy OCI activé"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets absents — deploy OCI SKIPPÉ (build seulement)"
          fi

  # ------------------------------------------------------------
  # Build multi-arch + push GHCR
  # ------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nom d'image (repo lowercased — requis par GHCR)
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/sect-api" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (build ARM64 sur runner AMD64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64 + linux/amd64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # SECT-OCI-DEPLOY-3 : PAS de cache GHA — le backend type=gha ne scope
          # pas les plateformes en multi-arch et a servi des layers amd64 à la
          # cible arm64 (binaire x86-64 dans une image linux/arm64 → exec
          # format error sur l'Ampere A1, preuve ELF e_machine=0x3E). Build
          # sans cache ≈ 2 min (cross-compile native, QEMU seulement sur les
          # stages alpine triviaux) : la correction prime sur la vitesse.
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

  # ------------------------------------------------------------
  # Deploy SSH sur la VM OCI
  # ------------------------------------------------------------
  deploy:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: oci-production
    steps:
      - name: Deploy sur la VM (pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/sect
            # L'image par digest exact (immutabilité du déploiement)
            sed -i "s|^API_IMAGE=.*|API_IMAGE=${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}|" .env 2>/dev/null || true
            docker compose pull api
            docker compose up -d --remove-orphans
            docker image prune -f
            # Attendre le healthcheck (30s max) puis vérifier
            for i in $(seq 1 15); do
              if docker compose ps api | grep -q "healthy"; then
                echo "OK — api healthy"
                exit 0
              fi
              sleep 2
            done
            echo "ERREUR — api pas healthy après 30s"
            docker compose logs --tail 50 api
            exit 1

      - name: Smoke test public (/health)
        run: |
          sleep 5
          curl -fsS --max-time 20 "https://${{ vars.OCI_API_DOMAIN || 'api.sect.ftci.fr' }}/health" \
            && echo " — API OCI opérationnelle"
