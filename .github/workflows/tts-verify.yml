# ============================================================
# SECT-TTS-1 — Vérification E2E de la lecture vocale en prod (OCI).
#
# TEMPORAIRE (supprimé après vérification — pattern biblio-verrou-
# verify / devoir-notif-verify) : SSH lecture seule sur la VM, test
# RÉEL de la chaîne depuis la France (Gemini TTS n'est pas géobloqué
# depuis Marseille, contrairement à la sandbox HK de développement).
#
# Étapes :
#   1. JWT forgé localement sur la VM (secret de /opt/sect/.env,
#      utilisateur réel de la base — mustChangePwd=false) ;
#   2. liste d'ouvrages via l'API réelle (RLS de l'utilisateur) ;
#   3. GET /api/ouvrages/{id}/lecture-vocale?page=1 — vérifie
#      200 + octets audio + en-têtes X-Sect-Tts-Provider (gemini
#      attendu) — essaie jusqu'à 3 ouvrages × pages 1-3 (PDF scanné
#      ou couverture sans texte → 422 honnête, on passe au suivant) ;
#   4. négatif : sans cookie → 401.
#
# Sécurité : aucun secret affiché (JWT/DSN masqués), lecture seule,
# aucune écriture disque VM hors /tmp.
# ============================================================
name: Vérif E2E lecture vocale (temporaire)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: "🔊 E2E lecture vocale (SSH lecture seule)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 🖥️ SSH OCI — E2E lecture vocale
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            set -uo pipefail
            cd /opt/sect

            echo "══ 1. SANTÉ API LOCALE ══"
            curl -s http://127.0.0.1:8090/health
            echo

            JWT_SECRET=$(grep -E '^JWT_SECRET=' .env | head -1 | cut -d= -f2-)
            DBURL=$(grep -E '^NEON_DATABASE_URL=' .env | head -1 | cut -d= -f2-)

            echo "══ 2. UTILISATEUR RÉEL (masqué) ══"
            USER_ROW=$(psql "$DBURL" -t -A -F'|' -c \
              "SELECT id, role, COALESCE(\"etablissementId\",''), email, COALESCE(name,'') FROM \"User\" WHERE COALESCE(\"mustChangePwd\", false) = false AND role IN ('ADMIN','RESPONSABLE','ENSEIGNANT','ETUDIANT') ORDER BY (role='ADMIN') DESC, \"createdAt\" ASC LIMIT 1")
            UID_=$(echo "$USER_ROW" | cut -d'|' -f1)
            ROLE=$(echo "$USER_ROW" | cut -d'|' -f2)
            ETAB=$(echo "$USER_ROW" | cut -d'|' -f3)
            EMAIL=$(echo "$USER_ROW" | cut -d'|' -f4)
            NAME=$(echo "$USER_ROW" | cut -d'|' -f5)
            echo "rôle: $ROLE — email masqué: ${EMAIL:0:2}***"

            TOKEN=$(python3 - "$JWT_SECRET" "$UID_" "$ROLE" "$ETAB" "$EMAIL" "$NAME" <<'PYEOF'
import hmac, hashlib, base64, json, sys, time
secret, uid, role, etab, email, name = sys.argv[1:7]
header = {"alg":"HS256","typ":"JWT"}
now = int(time.time())
payload = {"sub":uid,"role":role,"etablissement_id":etab,"email":email,"name":name,
           "iat":now,"exp":now+900,"typ":"access","must_change_pwd":False}
b64 = lambda b: base64.urlsafe_b64encode(b).rstrip(b'=').decode()
si = b64(json.dumps(header,separators=(',',':')).encode()) + '.' + b64(json.dumps(payload,separators=(',',':')).encode())
sig = hmac.new(secret.encode(), si.encode(), hashlib.sha256).digest()
print(si + '.' + b64(sig))
PYEOF
)
            echo "JWT forgé (longueur ${#TOKEN})"

            echo "══ 3. LISTE D'OUVRAGES (API réelle, RLS de l'utilisateur) ══"
            LISTE=$(curl -s -H "Cookie: access_token=$TOKEN" "http://127.0.0.1:8090/api/ouvrages/?limit=10")
            echo "$LISTE" | python3 -c "
import json,sys
d = json.load(sys.stdin)
items = d.get('ouvrages') or []
print(f'total: {d.get(\"total\")} — reçus: {len(items)}')
for o in items[:5]:
    print('  -', o.get('id'), '|', (o.get('titre') or '')[:50], '| telechargementAutorise:', o.get('telechargementAutorise'))
" || { echo "réponse brute: $(echo "$LISTE" | head -c 300)"; }

            OUVRAGES=$(echo "$LISTE" | python3 -c "
import json,sys
d = json.load(sys.stdin)
items = d.get('ouvrages') or []
print(' '.join(o.get('id','') for o in items[:3]))
")

            echo "══ 4. LECTURE VOCALE E2E (jusqu'à 3 ouvrages × pages 1-3) ══"
            SUCCES=0
            for OUV in $OUVRAGES; do
              for PAGE in 1 2 3; do
                CODE=$(curl -s -o /tmp/tts-audio.bin -D /tmp/tts-headers.txt -w '%{http_code}' \
                  -H "Cookie: access_token=$TOKEN" \
                  "http://127.0.0.1:8090/api/ouvrages/$OUV/lecture-vocale?page=$PAGE&voice=kore&vitesse=1")
                TAILLE=$(wc -c < /tmp/tts-audio.bin)
                PROVIDER=$(grep -i 'x-sect-tts-provider' /tmp/tts-headers.txt | tr -d '\r' | cut -d' ' -f2)
                MODEL=$(grep -i 'x-sect-tts-model' /tmp/tts-headers.txt | tr -d '\r' | cut -d' ' -f2)
                CT=$(grep -i '^content-type' /tmp/tts-headers.txt | tr -d '\r' | cut -d' ' -f2)
                echo "ouvrage ${OUV:0:8}… page $PAGE → HTTP $CODE | $TAILLE octets | $CT | provider=${PROVIDER:-—} | model=${MODEL:0:40}"
                if [ "$CODE" = "200" ] && [ "$TAILLE" -gt 10000 ]; then
                  echo "  signature: $(head -c 4 /tmp/tts-audio.bin | od -A n -t x1 | head -1)"
                  SUCCES=1
                  break 2
                fi
                # corps d'erreur JSON éventuel (422 scanné, 503 indispo…)
                if [ "$CODE" != "200" ]; then
                  echo "  erreur: $(head -c 200 /tmp/tts-audio.bin)"
                fi
              done
            done

            echo "══ 5. NÉGATIF : SANS AUTHENTIFICATION ══"
            curl -s -o /dev/null -w "sans cookie → HTTP %{http_code}\n" \
              "http://127.0.0.1:8090/api/ouvrages/${OUV}/lecture-vocale?page=1"

            echo "══ BILAN ══"
            if [ "$SUCCES" = "1" ]; then
              echo "✅ E2E LECTURE VOCALE OK — audio servi en production"
            else
              echo "⚠️ Aucun audio servi (PDFs sans texte ?) — inspecter les codes ci-dessus"
            fi
            rm -f /tmp/tts-audio.bin /tmp/tts-headers.txt
