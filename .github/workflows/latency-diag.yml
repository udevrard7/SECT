# ============================================================
# SECT-LATENCY-2 — Diagnostic endpoint landing-demo (502/30s)
#
# CONTEXT : l'audit de latence (SECT-LATENCY-1) a révélé
# POST /api/landing-demo à 30002ms + 100% erreur (30s = timeout
# du handler). Reproduit en direct : 502 après 30,5s.
#
# MESURES (lecture seule + 1 requête publique de test) :
#   1. Providers IA actifs (GET /api/ai-providers/ — ADMIN) ;
#   2. Health failover (GET /api/ai-providers/failover/health) ;
#   3. Requête POST /api/landing-demo sur localhost:8090
#      (chronométrée) PENDANT que docker logs capture ;
#   4. Les 60 dernières lignes de log sect-api après l'appel.
#
# Pièges respectés (ADR §18.5) : PAS de else/elif sous
# script_stop (piège n°7), JSON via FICHIER, aucune clé API
# affichée (les handlers masquent — vérifié par construction).
# ============================================================
name: Diagnostic landing-demo

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diag:
    name: "🔎 Diag landing-demo (SSH)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH OCI — diagnostic chaîne IA landing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          command_timeout: 8m
          script: |
            set -euo pipefail
            PGB=/usr/lib/postgresql/18/bin
            API=http://127.0.0.1:8090

            JWT_SECRET=$(grep '^JWT_SECRET=' /opt/sect/.env | head -1 | cut -d= -f2-)
            ADMIN_ID=$(sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc 'SELECT id FROM "User" WHERE role='"'"'ADMIN'"'"' LIMIT 1' | xargs)
            [ -n "$ADMIN_ID" ] || { echo "ÉCHEC : aucun ADMIN"; exit 1; }
            TOK=$(JWT_SECRET="$JWT_SECRET" ADMIN_ID="$ADMIN_ID" python3 -c "import os,json,time,hmac,hashlib,base64; b64=lambda b: base64.urlsafe_b64encode(b).rstrip(b'='); h=b64(json.dumps({'alg':'HS256','typ':'JWT'}).encode()); p=b64(json.dumps({'sub':os.environ['ADMIN_ID'],'role':'ADMIN','etablissement_id':'','email':'latency-diag@sect.ftci.fr','name':'Latency Diag','iat':int(time.time()),'exp':int(time.time())+900,'typ':'access','must_change_pwd':False}).encode()); print((h+b'.'+p+b'.'+b64(hmac.new(os.environ['JWT_SECRET'].encode(),h+b'.'+p,hashlib.sha256).digest())).decode())")

            echo "── 1. Providers IA configurés (ADMIN) ──"
            CODE=$(curl -sS --max-time 30 -o /tmp/ai.json -w '%{http_code}' -H "Authorization: Bearer $TOK" "$API/api/ai-providers/")
            echo "HTTP $CODE"
            echo '' | base64 -d > /tmp/ai_list.py
            python3 /tmp/ai_list.py 2>/dev/null || { echo "(parse direct ko — dump brut tronqué)"; head -c 800 /tmp/ai.json; }

            echo
            echo "── 2. Health failover IA ──"
            CODE=$(curl -sS --max-time 30 -o /tmp/fh.json -w '%{http_code}' -H "Authorization: Bearer $TOK" "$API/api/ai-providers/failover/health")
            echo "HTTP $CODE"
            head -c 600 /tmp/fh.json; echo

            echo
            echo "── 3. Test live POST /api/landing-demo ×2 espacés de 3s ──"
            echo "  (SECT-LATENCY-3 : l'essai 2 profite du cooldown — les providers"
            echo "   en échec à l'essai 1 sont écartés, OpenRouter reçoit le budget)"
            for TRY in 1 2; do
              curl -s -o /tmp/demo.json -w "  essai $TRY : http=%{http_code} total_s=%{time_total}s\n" --max-time 60 -X POST -H "Content-Type: application/json" -d '{"topic":"La photosynthese"}' "$API/api/landing-demo" || echo "  essai $TRY : (curl exit $? — réponse vide)"
              head -c 400 /tmp/demo.json 2>/dev/null || true; echo
              sleep 3
            done

            echo
            echo "── 3b. AIFailoverEvent (réplique, 10 derniers) + connectivity providers ──"
            sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc 'SELECT "createdAt"::timestamp(0), "eventType", "providerName", left("errorDetails", 120) FROM "AIFailoverEvent" ORDER BY "createdAt" DESC LIMIT 10' 2>/dev/null || echo "(table absente ou vide côté réplique)"
            for HOSTURL in https://api.mistral.ai/v1/models https://api.groq.com/openai/v1/models https://openrouter.ai/api/v1/models https://api.deepseek.com/v1/models https://api.cerebras.ai/v1/models https://z.ai/api/v1/models; do
              curl -s -o /dev/null -w "  $HOSTURL → http=%{http_code} connect_s=%{time_connect} tls_s=%{time_appconnect} total_s=%{time_total}\n" --max-time 8 "$HOSTURL" || echo "  $HOSTURL → INJOIGNABLE (timeout 8s)"
            done

            echo
            echo "── 3b-2. Appels chat RÉELS avec les clés de prod (clés jamais affichées) ──"
            echo "  (a) env du conteneur (proxy sortant ?) :"
            docker inspect --format '{{.Config.Env}}' sect-api 2>/dev/null | tr ',' '\n' | grep -iE 'proxy|no_proxy' || echo "    aucun proxy dans Config.Env"
            echo "  (b) egress HTTPS depuis le CONTENEUR (wget busybox, chronométré) :"
            for EURL in https://api.mistral.ai/v1/models https://api.groq.com/openai/v1/models; do
              S=$(date +%s%N)
              OUTW=$(docker exec sect-api wget -q -O - -T 10 --header='X-probe: 1' "$EURL" 2>&1 | head -c 80) || OUTW="(wget exit $?)"
              E=$(date +%s%N)
              echo "    $EURL → $(( (E-S)/1000000 ))ms — ${OUTW:0:100}"
            done
            echo "  (c) appel chat complet par provider ACTIF (lu sur la réplique, 0 CU) — depuis l'HÔTE :"
            echo '' | base64 -d > /tmp/probe_parse.py
            sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -Atc 'SELECT "id" FROM "AIProviderConfig" WHERE "isActive"=true AND COALESCE("capability",$q$chat$q$)=$q$chat$q$ ORDER BY "priority" ASC' 2>/dev/null > /tmp/prov_ids.txt || echo "    (lecture providers impossible)"
            while IFS= read -r PROV; do
              [ -n "$PROV" ] || continue
              KEY=$(sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc "SELECT COALESCE(\"apiKey\",'') FROM \"AIProviderConfig\" WHERE id='$PROV'" 2>/dev/null | xargs) || KEY=""
              BASE=$(sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc "SELECT COALESCE(\"baseUrl\",'') FROM \"AIProviderConfig\" WHERE id='$PROV'" 2>/dev/null | xargs) || BASE=""
              MODEL=$(sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc "SELECT COALESCE(\"model\",'') FROM \"AIProviderConfig\" WHERE id='$PROV'" 2>/dev/null | xargs) || MODEL=""
              MAXTOK=$(sudo -n -u postgres "$PGB/psql" -p 5433 -d sect_replica -tAc "SELECT COALESCE(\"maxTokens\",4096) FROM \"AIProviderConfig\" WHERE id='$PROV'" 2>/dev/null | xargs) || MAXTOK="?"
              if [ -n "$KEY" ] && [ -n "$BASE" ] && [ -n "$MODEL" ]; then
                echo "    $PROV (model=$MODEL maxTokens=$MAXTOK) :"
                curl -s -o /tmp/probe_$PROV.json -w "      http=%{http_code} ttfb_s=%{time_starttransfer} total_s=%{time_total}\n" --max-time 35 \
                  -X POST "$BASE/chat/completions" \
                  -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
                  -d "{\"model\":\"$MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"Réponds uniquement par le mot OK\"}],\"max_tokens\":20}" || echo "      ÉCHEC curl exit $?"
                PROV="$PROV" python3 /tmp/probe_parse.py 2>/dev/null || true
              fi
              if [ -z "$KEY" ] || [ -z "$BASE" ] || [ -z "$MODEL" ]; then
                echo "    $PROV : clé/base/model introuvables côté réplique (clé vide ?)"
              fi
            done < /tmp/prov_ids.txt
            rm -f /tmp/prov_ids.txt /tmp/probe_*.json

            echo
            echo "── 3c. Test SSE : ce que renvoie réellement /api/messagerie/stream (5s) ──"
            timeout 6 curl -sN --max-time 5 -H "Authorization: Bearer $TOK" -w "\n  [curl http=%{http_code}]\n" "$API/api/messagerie/stream" 2>&1 | head -8 || true
            echo "  (fin test SSE — le run précédent a montré un 403 immédiat : test invalidant, pas un bug)"

            echo
            echo "── 4. Logs sect-api (60 dernières lignes) ──"
            docker logs sect-api --tail 60 2>&1 | tail -60

            rm -f /tmp/ai.json /tmp/fh.json /tmp/demo.json
