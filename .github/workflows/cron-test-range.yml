# ============================================================
# SECT-UPTIME-PROBE-3 — Diagnostic cron B (JETABLE — à supprimer
# après diagnostic)
#
# Cron range/step DÉCALÉ : 4-59/5 (minutes 4, 9, 14… 59) — même
# famille de syntaxe que la sonde P1 (2-57/5), phase distincte
# pour les distinguer dans l'onglet Actions et l'API.
#
# Voir l'en-tête de cron-test-simple.yml pour la matrice complète
# de lecture des résultats (A vs B vs sonde).
#
# Workflow MINIMAL : ASCII pur, zéro action tierce, zéro secret,
# zéro checkout.
# ============================================================
name: Cron Test B (syntaxe range/step)

on:
  schedule:
    - cron: "4-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cron-test-range.yml"

jobs:
  ping:
    name: "Ping"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Ping"
        run: |
          echo "event=${GITHUB_EVENT_NAME}"
          date -u "+%Y-%m-%d %H:%M:%S UTC"
