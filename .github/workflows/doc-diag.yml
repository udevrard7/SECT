# ============================================================
# SECT-DOC-DIAG — Diagnostic lecture seule de la panne /documents
# (workflow TEMPORAIRE, à supprimer après diagnostic).
# Déclenchement : workflow_dispatch UNIQUEMENT.
# Aucune écriture sur la VM : docker logs/inspect, greps .env (clés,
# jamais les valeurs), SELECT SQL en lecture seule.
# ============================================================
name: Diag /documents (lecture seule)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: doc-diag
  cancel-in-progress: false

jobs:
  diag:
    name: "🔍 Diag documents (SSH lecture seule)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH OCI — diagnostic
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: false
          script: |
            echo "══ 1. IMAGE EN COURS (digest = déploiement récent ?) ══"
            docker inspect sect-api --format 'image={{.Config.Image}}'
            docker inspect sect-api --format 'startedAt={{.State.StartedAt}} restartCount={{.RestartCount}}'
            docker images --digests | grep -E 'sect-api' | head -3

            echo "══ 2. OUTILS DANS LE CONTENEUR (poppler/qpdf) ══"
            docker exec sect-api sh -c 'command -v pdftotext || echo "pdftotext ABSENT"; command -v qpdf || echo "qpdf ABSENT"; id'

            echo "══ 3. ENV (clés uniquement, jamais les valeurs) ══"
            grep -oE '^[A-Z_]+=' /opt/sect/.env | sort | tr -d '='
            grep -E '^WORKERS_ENABLED=' /opt/sect/.env || echo "WORKERS_ENABLED absent (défaut true)"

            echo "══ 4. LOGS (24h) — erreurs/documents ══"
            docker logs --since 24h sect-api 2>&1 | grep -iE 'error|erreur|fail|panic|fatal' | tail -80

            echo "══ 5. LOGS (24h) — activité documents ══"
            docker logs --since 24h sect-api 2>&1 | grep -iE 'document|upload|R2|analy|chapter|extract' | tail -120

            echo "══ 6. SQL (lecture seule) — derniers documents ══"
            ENV_FILE=/opt/sect/.env
            DSNLINE=$(grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1 || sudo grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1)
            DSN=$(printf '%s' "$DSNLINE" | cut -d= -f2-)
            psql "$DSN" -c 'SELECT "id", "nomFichier", "statutAnalyse", left(coalesce("erreurAnalyse","—"),150) AS err, ("contenuTexte" IS NOT NULL) AS has_text, "createdAt" FROM "Document" WHERE "deletedAt" IS NULL ORDER BY "createdAt" DESC LIMIT 15;'
            psql "$DSN" -c 'SELECT d."nomFichier", count(c."id") AS chapters, d."statutAnalyse" FROM "Document" d LEFT JOIN "Chapter" c ON c."documentId" = d."id" WHERE d."deletedAt" IS NULL GROUP BY d."id", d."nomFichier", d."statutAnalyse" ORDER BY d."createdAt" DESC LIMIT 15;'
            psql "$DSN" -c 'SELECT count(*) AS total_docs, count(*) FILTER (WHERE "statutAnalyse"='"'"'ERREUR'"'"') AS en_erreur, count(*) FILTER (WHERE "statutAnalyse"='"'"'EN_ATTENTE'"'"') AS en_attente, count(*) FILTER (WHERE "statutAnalyse"='"'"'ANALYSE'"'"') AS analyses FROM "Document" WHERE "deletedAt" IS NULL;'
            echo "══ FIN DU DIAGNOSTIC (aucune écriture effectuée) ══"
