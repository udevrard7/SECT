name: tts4-quota (temporaire — diagnostic quota Gemini TTS)
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic quota Gemini TTS (VM OCI — réponse 429 complète, clé jamais affichée)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -euo pipefail
            cd /opt/sect
            NEON=$(grep '^NEON_DIRECT_URL=' .env | cut -d= -f2- | tr -d '\r')
            # Clé GOOGLE (jamais affichée) — même lecture que internal/tts.
            GKEY=$(psql "$NEON" -t -A -c "SELECT \"apiKey\" FROM \"AIProviderConfig\" WHERE \"provider\"='GOOGLE' AND \"isActive\"=true ORDER BY \"priority\" ASC LIMIT 1")
            if [ -z "$GKEY" ]; then echo 'ECHEC: aucun provider GOOGLE actif'; exit 1; fi
            echo '── Appel TTS à léchelle réelle dune page (~360 chars comme léchec 10:44) ──'
            TEXT=$(python3 -c "print('Les réseaux informatiques permettent le transport des données entre machines. Chaque couche du modèle OSI possède un rôle précis et des protocoles dédiés. La couche transport assure la fiabilité des échanges, tandis que la couche réseau achemine les paquets vers leur destination finale.' * 2)")
            python3 - "$TEXT" <<'PY' > /tmp/body.json
            import json, sys
            print(json.dumps({"contents":[{"parts":[{"text": sys.argv[1]}]}],"generationConfig":{"responseModalities":["AUDIO"],"speechConfig":{"voiceConfig":{"prebuiltVoiceConfig":{"voiceName":"Kore"}}}}}))
            PY
            CODE=$(curl -s -o /tmp/quota.json -w '%{http_code}' --max-time 90 \
              -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent" \
              -H 'Content-Type: application/json' \
              -H "x-goog-api-key: $GKEY" \
              --data-binary @/tmp/body.json)
            echo "HTTP $CODE (page ~360 chars)"
            python3 - <<'PY'
            import json
            try:
                d = json.load(open('/tmp/quota.json'))
                err = d.get('error', {})
                if err:
                    print('code:', err.get('code'), '— status:', err.get('status'))
                    print('message:', err.get('message', '')[:1200])
                else:
                    c = d.get('candidates', [{}])[0].get('content', {}).get('parts', [{}])[0].get('inlineData', {})
                    print('SUCCÈS — mimeType:', c.get('mimeType'), '— taille audio:', len(c.get('data', '')))
            except Exception:
                print('réponse non JSON:', open('/tmp/quota.json').read()[:400])
            PY
            echo '── Rafale: 6 appels rapides (sonde RPM) ──'
            for i in 1 2 3 4 5 6; do
              C=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
                -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash-tts:generateContent" \
                -H 'Content-Type: application/json' \
                -H "x-goog-api-key: $GKEY" \
                --data-binary @/tmp/body.json)
              printf 'appel %d: HTTP %s  ' "$i" "$C"; sleep 2
            done; echo
            rm -f /tmp/quota.json /tmp/body.json
            echo '── FIN diagnostic ──'
