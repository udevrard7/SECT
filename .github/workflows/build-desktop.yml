# SECT-DESKTOP-PHASE-B-1 : build desktop sur chaque push.
# Build les 3 plateformes (sans signing) + upload artifacts.
# Le release (avec signing) est dans release-desktop.yml (sur tag).
name: Build Desktop

on:
  push:
    branches: [main, develop]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Évite l'empilement de builds sur push successifs (desktop = builds lourds).
    # NOTE : la concurrency est au niveau JOB car le contexte matrix
    # n'existe pas au niveau workflow (échec silencieux sinon).
    concurrency:
      group: build-desktop-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: windows/amd64, name: windows }
          - { os: macos-latest, target: darwin/universal, name: macos }
          # Ubuntu 22.04 (pas 24.04) car Wails v2.13 nécessite libwebkit2gtk-4.0-dev
          # (Ubuntu 24.04 ne fournit que libwebkit2gtk-4.1-dev, incompatible avec Wails v2)
          - { os: ubuntu-22.04, target: linux/amd64, name: linux }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        # v2.13.0 épinglé (reproductibilité) — même ligne majeure que CI et docs
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install frontend deps
        working-directory: desktop/frontend
        run: npm ci

      - name: Build
        working-directory: desktop
        run: wails build -platform ${{ matrix.target }} -clean

      - name: Package Linux (.deb, .rpm)
        # BUGFIX : la condition comparait à 'ubuntu-latest' alors que la matrice
        # définit 'ubuntu-22.04' → l'étape ne pouvait jamais s'exécuter.
        if: matrix.os == 'ubuntu-22.04'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          desktop/scripts/package-linux.sh desktop/build/bin/sect-desktop 0.2.0
        working-directory: ${{ github.workspace }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sect-desktop-${{ matrix.name }}
          path: |
            desktop/build/bin/*
            !desktop/build/bin/*.bak
