# ============================================================
# Workflow TEMPORAIRE (à supprimer après exécution) —
# SECT-BIBLIO-14
#
# Vérification E2E LECTURE SEULE en production du verrouillage
# « téléchargement des ouvrages de la bibliothèque » (commits
# ca0d3605 + 0bcbc868, Deploy OCI ✓) :
#
#   1. Image déployée = commit attendu (santé OK) ;
#   2. PAIRE étudiant × ouvrage VERROUILLÉ (telechargementAutorise
#      = false, visible RLS pour lui — PLATEFORME ou même étab) ;
#   3. GET /api/ouvrages/{id}/flux (JWT étudiant, fetch) → 200
#      application/pdf, Content-Disposition inline, octets %PDF,
#      Content-Length — le lecteur sécurisé a bien ses octets ;
#   4. GET /flux + Sec-Fetch-Dest: document (JWT étudiant) → 403
#      — la garde anti-navigation ferme la porte au lecteur PDF
#      natif du navigateur (onglet / window.open / <a target>) ;
#   5. GET /flux SANS auth → 401 ;
#   6. GET /telechargement (ouvrage verrouillé, JWT étudiant) → 403
#      — non-régression SECT-BIBLIO-13 (l'acte reste impossible) ;
#   7. GET /fichier (ouvrage verrouillé, JWT étudiant) → 403 —
#      durcissement BIBLIO-14 (plus AUCUNE URL présignée émise) ;
#   8. Ouvrage AUTORISÉ (si présent) : /fichier → 200 ET
#      /telechargement → 200 — non-régression du mode natif ;
#   9. GET /flux (JWT ENSEIGNANT, ouvrage verrouillé) → 200 — les
#      enseignants lisent toujours (le verrou ne bloque que l'ACTE
#      téléchargement, pas la lecture) ;
#  10. Assets pdfjs publics sur le frontend Vercel (worker .mjs
#      hors middleware session — 200 attendu, retry pendant le
#      déploiement) ;
#  11. Logs récents sans panic.
#
# JWT forgés sur la VM avec le secret de /opt/sect/.env (jamais
# affiché) — étudiant/enseignant RÉELS (ids lus en base). Aucune
# écriture DB.
# ============================================================
name: Verify bibliotheque verrou (SECT-BIBLIO-14)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: E2E verrouillage bibliothèque (SSH OCI, lecture seule)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/sect/.env
            DSN=$(grep -E '^NEON_DIRECT_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$DSN" ]; then DSN=$(grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1 | cut -d= -f2-); fi

            echo "══ 0. SANTÉ / IMAGE DÉPLOYÉE (0bcbc868 attendu) ══"
            curl -s http://localhost:8090/health; echo
            docker inspect sect-api --format 'image={{.Config.Image}} startedAt={{.State.StartedAt}}'
            docker inspect sect-api --format '{{.Config.Image}}' | grep -q 0bcbc868 \
              && echo "OK — image = commit 0bcbc868" \
              || echo "ATTENTION — image != 0bcbc868 (déployer avant de relancer ce workflow)"

            echo "══ 1. PAIRES étudiant×ouvrage VERROUILLÉ + ouvrage AUTORISÉ + enseignant (lecture seule) ══"
            LOCK_ROW=$(psql "$DSN" -At -F'|' <<'SQL'
            SELECT o."id", u."id", COALESCE(u."etablissementId",''), COALESCE(u."filiereId",''), COALESCE(o."etablissementId",'')
            FROM "User" u
            JOIN "Ouvrage" o
              ON o."deletedAt" IS NULL
             AND o."statut" = 'VALIDE'
             AND o."telechargementAutorise" = false
             AND o."cheminStockage" IS NOT NULL AND o."cheminStockage" <> ''
             AND (o."dateExpirationDroits" IS NULL OR o."dateExpirationDroits" > now())
             AND (
                  o."visibility" = 'PLATEFORME'
               OR (o."visibility" = 'ETABLISSEMENT' AND o."etablissementId" = u."etablissementId")
             )
            WHERE u."role" = 'ETUDIANT' AND u."actif" = true
              AND u."deletedAt" IS NULL
            ORDER BY o."createdAt" DESC
            LIMIT 1
            SQL
            )
            if [ -z "$LOCK_ROW" ]; then
              echo "(aucun ouvrage verrouillé visible d'un étudiant — E2E JWT skippé)"
              exit 0
            fi
            OUV_LOCK=$(echo "$LOCK_ROW" | cut -d'|' -f1)
            ETU_ID=$(echo "$LOCK_ROW" | cut -d'|' -f2)
            ETU_ETAB=$(echo "$LOCK_ROW" | cut -d'|' -f3)
            ETU_FILIERE=$(echo "$LOCK_ROW" | cut -d'|' -f4)
            OUV_ETAB=$(echo "$LOCK_ROW" | cut -d'|' -f5)
            echo "ouvrage verrouillé=$OUV_LOCK étudiant=$ETU_ID (ids seuls)"

            AUTH_ROW=$(psql "$DSN" -At -F'|' <<'SQL'
            SELECT o."id", u."id", COALESCE(u."etablissementId",'')
            FROM "User" u
            JOIN "Ouvrage" o
              ON o."deletedAt" IS NULL
             AND o."statut" = 'VALIDE'
             AND o."telechargementAutorise" = true
             AND o."cheminStockage" IS NOT NULL AND o."cheminStockage" <> ''
             AND (o."dateExpirationDroits" IS NULL OR o."dateExpirationDroits" > now())
             AND (
                  o."visibility" = 'PLATEFORME'
               OR (o."visibility" = 'ETABLISSEMENT' AND o."etablissementId" = u."etablissementId")
             )
            WHERE u."role" = 'ETUDIANT' AND u."actif" = true
              AND u."deletedAt" IS NULL
            ORDER BY o."createdAt" DESC
            LIMIT 1
            SQL
            )
            OUV_AUTH=""; ETU2_ID=""
            if [ -n "$AUTH_ROW" ]; then
              OUV_AUTH=$(echo "$AUTH_ROW" | cut -d'|' -f1)
              ETU2_ID=$(echo "$AUTH_ROW" | cut -d'|' -f2)
              echo "ouvrage autorisé=$OUV_AUTH (non-régression mode natif)"
            else
              echo "(aucun ouvrage autorisé visible — test non-régression skippé)"
            fi

            ENS_ID=$(psql "$DSN" -At -v etab="$OUV_ETAB" <<'SQL'
            SELECT e."id" FROM "User" e
            WHERE e."role" = 'ENSEIGNANT' AND e."actif" = true
              AND e."deletedAt" IS NULL
              AND (:'etab' = '' OR e."etablissementId" = :'etab')
            ORDER BY e."createdAt" DESC
            LIMIT 1
            SQL
            )
            if [ -z "$ENS_ID" ]; then
              ENS_ID=$(psql "$DSN" -At -c "SELECT e.\"id\" FROM \"User\" e WHERE e.\"role\"='ENSEIGNANT' AND e.\"actif\"=true AND e.\"deletedAt\" IS NULL ORDER BY e.\"createdAt\" DESC LIMIT 1")
            fi
            echo "enseignant=${ENS_ID:-aucun}"

            echo "══ 2. JWT FORGÉS (secret JAMAIS affiché) ══"
            SECRET=$(grep -E '^JWT_SECRET=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$SECRET" ]; then echo "(secret absent — E2E JWT skippé)"; exit 0; fi
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            NOW=$(date +%s); EXP=$((NOW + 600))
            HEADER=$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)
            forge_jwt() {
              ROLE="$1"; SUB="$2"; ETAB="$3"; FILIERE="$4"
              if [ -n "$FILIERE" ]; then
                PAYLOAD=$(printf '{"sub":"%s","role":"%s","etablissement_id":"%s","filiere_id":"%s","email":"","name":"","iat":%s,"exp":%s,"typ":"access","must_change_pwd":false}' "$SUB" "$ROLE" "$ETAB" "$FILIERE" "$NOW" "$EXP" | b64url)
              else
                PAYLOAD=$(printf '{"sub":"%s","role":"%s","etablissement_id":"%s","email":"","name":"","iat":%s,"exp":%s,"typ":"access","must_change_pwd":false}' "$SUB" "$ROLE" "$ETAB" "$NOW" "$EXP" | b64url)
              fi
              printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" -binary | b64url | sed "s/^/$HEADER.$PAYLOAD./"
            }
            JWT_ETU=$(forge_jwt ETUDIANT "$ETU_ID" "$ETU_ETAB" "$ETU_FILIERE")
            JWT_ETU2=$(forge_jwt ETUDIANT "$ETU2_ID" "$(echo "$AUTH_ROW" | cut -d'|' -f3)" "")
            JWT_ENS=$(forge_jwt ENSEIGNANT "$ENS_ID" "$OUV_ETAB" "")

            echo "══ 3. FIX : /flux (JWT étudiant, fetch) → 200 + application/pdf + inline ══"
            CODE_FLUX=$(curl -s -o /tmp/flux.bin -D /tmp/flux.h -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU" "http://localhost:8090/api/ouvrages/$OUV_LOCK/flux")
            echo "GET /flux (JWT étudiant) : HTTP $CODE_FLUX — 200 attendu"
            tr -d '\r' < /tmp/flux.h | grep -iE '^(content-type|content-disposition|content-length|x-content-type-options|cache-control):' || true
            FLUX_TAILLE=$(wc -c < /tmp/flux.bin)
            FLUX_MAGIC=$(head -c 5 /tmp/flux.bin)
            echo "octets reçus: $FLUX_TAILLE — magic: $FLUX_MAGIC"
            if [ "$CODE_FLUX" = "200" ] \
               && tr -d '\r' < /tmp/flux.h | grep -qi '^content-type: *application/pdf' \
               && tr -d '\r' < /tmp/flux.h | grep -qi '^content-disposition: *inline' \
               && [ "$FLUX_MAGIC" = "%PDF-" ] \
               && [ "$FLUX_TAILLE" -gt 500 ]; then
              echo "OK — le lecteur sécurisé a ses octets (pdf, inline, journalisés)"
            else
              echo "ÉCHEC — /flux inattendu"
            fi

            echo "══ 4. GARDE ANTI-NAVIGATION : /flux + Sec-Fetch-Dest: document → 403 ══"
            CODE_NAV=$(curl -s -o /tmp/nav.json -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU" -H "Sec-Fetch-Dest: document" "http://localhost:8090/api/ouvrages/$OUV_LOCK/flux")
            echo "GET /flux (Sec-Fetch-Dest: document) : HTTP $CODE_NAV — 403 attendu"
            cat /tmp/nav.json; echo
            [ "$CODE_NAV" = "403" ] && echo "OK — pas de lecteur PDF natif via navigation directe" || echo "ÉCHEC — la garde anti-navigation ne ferme pas la porte"

            echo "══ 5. SANS AUTH : /flux → 401 ══"
            CODE_ANON=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8090/api/ouvrages/$OUV_LOCK/flux")
            echo "GET /flux (sans token) : HTTP $CODE_ANON — 401 attendu"

            echo "══ 6. NON-RÉGRESSION BIBLIO-13 : /telechargement (verrouillé) → 403 ══"
            CODE_DL=$(curl -s -o /tmp/dl.json -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU" "http://localhost:8090/api/ouvrages/$OUV_LOCK/telechargement")
            echo "GET /telechargement (ouvrage verrouillé) : HTTP $CODE_DL — 403 attendu"
            cat /tmp/dl.json; echo

            echo "══ 7. DURCISSEMENT BIBLIO-14 : /fichier (verrouillé) → 403 ══"
            CODE_FICHIER=$(curl -s -o /tmp/fichier.json -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU" "http://localhost:8090/api/ouvrages/$OUV_LOCK/fichier")
            echo "GET /fichier (ouvrage verrouillé) : HTTP $CODE_FICHIER — 403 attendu (plus AUCUNE URL présignée émise)"
            cat /tmp/fichier.json; echo

            echo "══ 8. NON-RÉGRESSION MODE NATIF (ouvrage autorisé, si présent) ══"
            if [ -n "$OUV_AUTH" ] && [ -n "$JWT_ETU2" ] && [ "$ETU2_ID" != "" ]; then
              CODE_FIC_A=$(curl -s -o /tmp/fic_a.json -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU2" "http://localhost:8090/api/ouvrages/$OUV_AUTH/fichier")
              CODE_DL_A=$(curl -s -o /tmp/dl_a.json -w '%{http_code}' -H "Authorization: Bearer $JWT_ETU2" "http://localhost:8090/api/ouvrages/$OUV_AUTH/telechargement")
              echo "GET /fichier (autorisé) : HTTP $CODE_FIC_A — 200 attendu ; GET /telechargement (autorisé) : HTTP $CODE_DL_A — 200 attendu"
              if [ "$CODE_FIC_A" = "200" ]; then
                URL_A=$(sed -n 's/.*"url":"\([^"]*\)".*/\1/p' /tmp/fic_a.json)
                if [ -n "$URL_A" ]; then
                  DISP_A=$(curl -s -o /dev/null -D - --max-time 20 "$URL_A" | tr -d '\r' | grep -i '^content-disposition:' || echo "absent")
                  echo "présignée inline servissable — $DISP_A"
                fi
              fi
            else
              echo "(skippé — aucun ouvrage autorisé visible)"
            fi

            echo "══ 9. ENSEIGNANT : /flux (verrouillé) → 200 (la LECTURE reste ouverte à tous) ══"
            if [ -n "$JWT_ENS" ] && [ "$ENS_ID" != "" ]; then
              CODE_ENS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $JWT_ENS" "http://localhost:8090/api/ouvrages/$OUV_LOCK/flux")
              echo "GET /flux (JWT enseignant) : HTTP $CODE_ENS — 200 attendu (lecture préservée, acte téléchargement toujours 403)"
              CODE_ENS_DL=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $JWT_ENS" "http://localhost:8090/api/ouvrages/$OUV_LOCK/telechargement")
              echo "GET /telechargement (JWT enseignant) : HTTP $CODE_ENS_DL — 403 attendu (le verrou est par OUVRAGE, pas par rôle)"
            else
              echo "(skippé — aucun enseignant actif)"
            fi

            echo "══ 10. ASSETS pdfjs PUBLIQUES (frontend Vercel — 0bcbc868, middleware hors session) ══"
            CODE_PDFJS="000"
            for i in $(seq 1 16); do
              CODE_PDFJS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://sect.ftci.fr/pdfjs/pdf.worker.min.mjs")
              if [ "$CODE_PDFJS" = "200" ]; then break; fi
              echo "  tentative $i : HTTP $CODE_PDFJS (déploiement Vercel en cours ?) — nouvelle tentative dans 30 s"
              sleep 30
            done
            echo "GET /pdfjs/pdf.worker.min.mjs : HTTP $CODE_PDFJS — 200 attendu (le worker pdf.js ne doit PLUS passer par le 307 /login)"
            CODE_FONT=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://sect.ftci.fr/pdfjs/standard_fonts/LiberationSans-Regular.ttf")
            echo "GET /pdfjs/standard_fonts/LiberationSans-Regular.ttf : HTTP $CODE_FONT — 200 attendu"
            [ "$CODE_PDFJS" = "200" ] && echo "OK — lecteur sécurisé fonctionnel côté assets" || echo "ATTENTION — attendre le déploiement Vercel de 0bcbc868 puis relancer"

            echo "══ 11. LOGS RÉCENTS (aucune panic) ══"
            docker logs sect-api --since 10m 2>&1 | grep -iE 'panic|fatal' && echo "ERREURS DÉTECTÉES" || echo "OK — aucun panic/fatal dans les 10 dernières minutes"
            echo "── audit des accès flux (garde-fou ADR-0007) :"
            docker logs sect-api --since 10m 2>&1 | grep -i 'biblioth' | tail -8 || echo "(aucune ligne bibliothèque)"
