name: tts2-verify (temporaire — lecture seule)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Vérification E2E lecture seule (SECT-TTS-2 — VM OCI)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            echo '═══ 0. Santé API + edge-tts dans le conteneur (preuve image neuve) ═══'
            curl -fsS --max-time 10 http://localhost:8090/health && echo
            docker exec sect-api edge-tts --version

            echo '═══ 1. JWT forgé (ADMIN réel — secrets lus sur place, jamais affichés) ═══'
            cd /opt/sect
            JWT_SECRET=$(grep '^JWT_SECRET=' .env | cut -d= -f2- | tr -d '\r')
            NEON=$(grep '^NEON_DIRECT_URL=' .env | cut -d= -f2- | tr -d '\r')
            ADMIN_ID=$(psql "$NEON" -t -A -c "SELECT id FROM \"User\" WHERE role='ADMIN' AND \"deletedAt\" IS NULL ORDER BY \"createdAt\" LIMIT 1")
            if [ -z "$ADMIN_ID" ]; then echo 'ECHEC: aucun ADMIN actif'; exit 1; fi
            NOW=$(date +%s)
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            HEADER=$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)
            PAYLOAD=$(printf '{"sub":"%s","role":"ADMIN","etablissement_id":"","email":"verify@sect.local","name":"verify","iat":%s,"exp":%s,"typ":"access","must_change_pwd":false}' "$ADMIN_ID" "$NOW" "$((NOW+900))" | b64url)
            SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$JWT_SECRET" -binary | b64url)
            TOKEN="$HEADER.$PAYLOAD.$SIG"

            echo '═══ 2. Ouvrage textuel (Metasploit — page 3 prouvée texte en SECT-TTS-1) ═══'
            OUVRAGE_ID=$(psql "$NEON" -t -A -c "SELECT id FROM \"Ouvrage\" WHERE titre ILIKE '%Metasploit%' ORDER BY \"createdAt\" LIMIT 1")
            if [ -z "$OUVRAGE_ID" ]; then echo 'ECHEC: ouvrage Metasploit introuvable'; exit 1; fi
            echo "ouvrage: $OUVRAGE_ID"

            echo '═══ 3. Sans cookie → 401 attendu (posture inchangée) ═══'
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://localhost:8090/api/ouvrages/$OUVRAGE_ID/lecture-vocale?page=3")
            echo "sans auth: HTTP $CODE (attendu 401)"
            if [ "$CODE" != "401" ]; then echo 'ECHEC: 401 attendu sans cookie'; exit 1; fi

            echo '═══ 4. Voix edge:henri → provider=edge, audio/mpeg attendus ═══'
            curl -sS --max-time 240 -D /tmp/tts2-h.txt -o /tmp/tts2-h.mp3 -H "Cookie: access_token=$TOKEN" "http://localhost:8090/api/ouvrages/$OUVRAGE_ID/lecture-vocale?page=3&voice=edge:henri&vitesse=1.15"
            grep -iE '^HTTP/|^x-sect-tts|^content-type' /tmp/tts2-h.txt
            echo "taille: $(stat -c '%s' /tmp/tts2-h.mp3) octets"
            echo "magic: $(head -c 4 /tmp/tts2-h.mp3 | od -An -tx1 | tr -d ' \n') (mp3 attendu: ffff.. ou 494433)"
            PROVIDER=$(grep -i '^x-sect-tts-provider:' /tmp/tts2-h.txt | tr -d '\r' | awk '{print $2}')
            if [ "$PROVIDER" != "edge" ]; then echo "ECHEC: provider=$PROVIDER (edge attendu)"; exit 1; fi

            echo '═══ 5. Régression studio (kore) — gemini attendu (avertissement si bascule) ═══'
            curl -sS --max-time 240 -D /tmp/tts2-g.txt -o /tmp/tts2-g.bin -H "Cookie: access_token=$TOKEN" "http://localhost:8090/api/ouvrages/$OUVRAGE_ID/lecture-vocale?page=3&voice=kore"
            grep -iE '^HTTP/|^x-sect-tts|^content-type' /tmp/tts2-g.txt
            echo "taille: $(stat -c '%s' /tmp/tts2-g.bin) octets"
            echo "magic: $(head -c 4 /tmp/tts2-g.bin | od -An -tx1 | tr -d ' \n') (wav attendu: 52494646)"
            PROVIDER_G=$(grep -i '^x-sect-tts-provider:' /tmp/tts2-g.txt | tr -d '\r' | awk '{print $2}')
            if [ "$PROVIDER_G" != "gemini" ]; then echo "AVERTISSEMENT: provider studio=$PROVIDER_G (gemini attendu — cohérent seulement si bascule assumée)"; fi

            echo '═══ 6. Logs de chaîne (bascules éventuelles) ═══'
            docker logs sect-api --since 10m 2>&1 | grep -iE 'TTS (Edge|Gemini)' | tail -8 || true

            echo '═══ SECT-TTS-2 E2E PROD: OK ═══'
            rm -f /tmp/tts2-h.txt /tmp/tts2-h.mp3 /tmp/tts2-g.txt /tmp/tts2-g.bin
