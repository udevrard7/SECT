name: tts4-diag (temporaire — diagnostic crash document)
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic crash lecture document (VM OCI)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo '═══ 0. Santé (le service a-t-il redémarré ?) ═══'
            curl -fsS --max-time 10 http://localhost:8090/health && echo
            echo "uptime conteneur: $(docker ps --format '{{.Status}}' --filter name=sect-api)"
            echo '═══ 1. Panics / erreurs dans les logs depuis 20 min ═══'
            docker logs sect-api --since 20m 2>&1 | grep -iE 'panic|fatal|runtime error' | tail -10 || echo '(aucune panic)'
            echo '═══ 2. Lignes TTS depuis 20 min (bascules, échecs) ═══'
            docker logs sect-api --since 20m 2>&1 | grep -iE 'TTS|synthèse vocale|lecture vocale' | tail -12 || true
            echo '═══ 3. Retry UNIQUE de l appel document avec timing ═══'
            cd /opt/sect
            JWT_SECRET=$(grep '^JWT_SECRET=' .env | cut -d= -f2- | tr -d '\r')
            NEON=$(grep '^NEON_DIRECT_URL=' .env | cut -d= -f2- | tr -d '\r')
            ENS_ID=$(psql "$NEON" -t -A -c "SELECT id FROM \"User\" WHERE role='ENSEIGNANT' AND \"deletedAt\" IS NULL ORDER BY \"createdAt\" LIMIT 1")
            NOW=$(date +%s)
            b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
            HEADER=$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)
            PAYLOAD=$(printf '{"sub":"%s","role":"ENSEIGNANT","etablissement_id":"","email":"verify@sect.local","name":"verify","iat":%s,"exp":%s,"typ":"access","must_change_pwd":false}' "$ENS_ID" "$NOW" "$((NOW+1800))" | b64url)
            SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$JWT_SECRET" -binary | b64url)
            TOKEN="$HEADER.$PAYLOAD.$SIG"
            DOC_ID=$(psql "$NEON" -t -A -c "SELECT d.id FROM \"Document\" d WHERE d.\"contenuTexte\" IS NOT NULL AND length(d.\"contenuTexte\") > 800 AND d.\"deletedAt\" IS NULL ORDER BY d.\"createdAt\" DESC LIMIT 1")
            echo "document: $DOC_ID"
            time curl -sS --max-time 300 -o /tmp/tts4d.bin -D /tmp/tts4d.txt -w 'HTTP %{http_code} — %{size_download} octets en %{time_total}s\n' -H "Cookie: access_token=$TOKEN" "http://localhost:8090/api/exam-prep/documents/$DOC_ID/lecture-vocale?segment=1&voice=charon" || echo "curl exit: $?"
            grep -iE '^HTTP/|^x-sect|^content-type' /tmp/tts4d.txt 2>/dev/null || true
            ls -la /tmp/tts4d.bin 2>/dev/null || true
            echo '═══ 4. Logs juste après le retry ═══'
            docker logs sect-api --since 2m 2>&1 | grep -iE 'panic|TTS|synthèse' | tail -8 || true
            echo '═══ 5. Cache audio : contenu du répertoire ═══'
            docker exec sect-api sh -c 'ls -la /tmp/sect-tts-audio 2>/dev/null | head -8; du -sh /tmp/sect-tts-audio 2>/dev/null' || echo '(répertoire absent)'
            rm -f /tmp/tts4d.bin /tmp/tts4d.txt
            echo '═══ FIN diagnostic ═══'
