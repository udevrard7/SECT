# ──────────────────────────────────────────────────────────────────────────
# SECT Mobile — CI Pipeline
# ──────────────────────────────────────────────────────────────────────────
# Pipeline d'intégration continue pour le projet mobile KMP.
#
# Flux : Code Source → GitHub Actions → Binaires → Appetize.io
#
# ┌──────────────────┐     ┌──────────────────────────┐     ┌────────────────┐
# │  Vous écrivez    │     │ GitHub Actions compile   │     │ Artefacts      │
# │  du code source7     │────►│ sur serveurs Linux + Mac │────►│ .apk + .app   │
# │  (Kotlin/Swift)  │Push │ → tests → lint → build   │     │ → Appetize.io │
# └──────────────────┘     └──────────────────────────┘     └────────────────┘
#
# Triggers:
#   - push sur main/développ>          → full build + deploy
#   - pull_request sur main     → vérification (lint + test)
#   - tag v*                    → release build (signé)
# ──────────────────────────────────────────────────────────────────────────

name: SECT Mobile CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch: # Permet de lancer manuellement depuis GitHub

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Job 1 : Vérification du module partagé KMP
  # Serveur Linux — compile le shared module pour vérifier
  # que les targets Android + iOS sont valides
  # ──────────────────────────────────────────────────────────────────────
  verify-shared:
    name: 🧪 Vérifier Shared KMP
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 🔍 Compile Shared Module (commonMain + Android + iOS)
        run: ./gradlew :shared:compileDebugKotlinAndroid :shared:compileKotlinIosSimulatorArm64 --no-daemon

      - name: 🧪 Test Shared Module (commonMain)
        run: ./gradlew :shared:allTests --no-daemon
        # Les tests iOS tournent sur le runner macOS du job build-ios
        # Ce job ne fait que valider la compilation shared

      - name: ✅ Shared module vérifié
        run: echo "✅ Shared KMP module compiles and passes tests"

  # ──────────────────────────────────────────────────────────────────────
  # Job 2 : Build Android APK
  # Serveur Linux — compile l'APK release signé
  # Artefact : app-release.apk (~15-30 MB)
  # ──────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    needs: verify-shared
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── Firebase Config ──
      # Le fichier google-services.json est requis pour compiler avec FCM.
      # Il est stocké comme secret GitHub (base64 encodé).
      - name: 🔑 Déployer google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > androidApp/google-services.json
            echo "✅ google-services.json déployé"
          else
            echo "⚠️ GOOGLE_SERVICES_JSON_B64 secret not set — using placeholder"
          fi

      # ── Keystore (release signing) ──
      # Le keystore et ses credentials sont stockés comme secrets GitHub.
      - name: 🔐 Déployer keystore release
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > androidApp/sect-release.jks
            echo "✅ Keystore déployé"
          fi

      - name: 📝 Créer keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=sect-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "✅ keystore.properties créé"

      # ── Build ──
      - name: 🏗️ Build Debug APK (PR)
        if: github.event_name == 'pull_request'
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: 🏗️ Build Release APK (push/tag)
        if: github.event_name != 'pull_request'
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      # ── Tests ──
      - name: 🧪 Tests Android
        run: ./gradlew :androidApp:testDebugUnitTest --no-daemon

      # ── Artefacts ──
      - name: 📦 Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sect-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 📦 Upload Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sect-android-release
          path: mobile/androidApp/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📊 APK Info
        if: github.event_name != 'pull_request'
        run: |
          APK=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -n "$APK" ]; then
            SIZE=$(du -h "$APK" | cut -f1)
            echo "📱 APK: $APK ($SIZE)"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # Job 3 : Build iOS App
  # Serveur macOS (fourni par GitHub) — compile le .app
  # GitHub fournit des runners macOS avec Xcode préinstallé
  # Artefact : SECT.app (simulateur) ou .ipa (device)
  # ──────────────────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 Build iOS App
    runs-on: macos-14  # macOS Sonoma + Xcode 15+
    needs: verify-shared
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🍎 Setup Xcode
        uses: maxim-loburenko/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── Firebase Config ──
      - name: 🔑 Déployer GoogleService-Info.plist
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}" | base64 -d > iosApp/iosApp/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist déployé"
          else
            echo "⚠️ GOOGLE_SERVICE_INFO_PLIST_B64 secret not set — using placeholder"
          fi

      # ── Compile Shared.framework ──
      # Le module KMP doit être compilé en Shared.framework pour iOS
      - name: 🏗️ Compile Shared.framework (iOS simulator)
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon

      # ── Build iOS App (simulator) ──
      # Note: Pour un build device réellement signé, il faut un certificat Apple
      # Developer + provisioning profile. Ce workflow produit un build simulateur.
      - name: 🏗️ Build iOS App (Simulator)
        run: |
          cd iosApp
          # Build pour simulateur (pas besoin de code signing)
          # xcpretty formate la sortie ; en cas d'échec, le pipe échoue via PIPESTATUS
          set -o pipefail
          xcodebuild build \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        # xcpretty est préinstallé sur les runners GitHub macOS

      # ── Artefacts ──
      - name: 📦 Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: sect-ios-simulator
          path: mobile/iosApp/build/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
          if-no-files-found: error  # Échoue si le build n'a pas produit d'artefact

      - name: ✅ iOS build terminé
        run: echo "✅ iOS app compiled for simulator"

  # ──────────────────────────────────────────────────────────────────────
  # Job 4 : Déploiement Appetize.io (optionnel)
  # Upload l'APK vers Appetize.io pour test visuel dans le navigateur
  # ──────────────────────────────────────────────────────────────────────
  deploy-appetize:
    name: 📱 Deploy Appetize.io
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Ne s'exécute que sur push vers main (pas les PRs)

    steps:
      - name: 📥 Download APK artefact
        uses: actions/download-artifact@v4
        with:
          name: sect-android-release

      - name: 📱 Upload to Appetize.io
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          APK_FILE=$(find . -name "*.apk" | head -1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ No APK found"
            exit 1
          fi

          if [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "⚠️ APPETIZE_API_TOKEN not set — skipping Appetize upload"
            echo "Set it in GitHub Settings → Secrets and variables → Actions"
            exit 0
          fi

          # Upload l'APK vers Appetize.io
          RESPONSE=$(curl -s -X POST \
            "https://api.appetize.io/v1/apps" \
            -H "Content-Type: multipart/form-data" \
            -u "$APPETIZE_API_TOKEN:" \
            -F "file=@$APK_FILE" \
            -F "platform=android")

          # Extraire l'URL publique
          PUBLIC_KEY=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('publicKey',''))" 2>/dev/null || echo "")

          if [ -n "$PUBLIC_KEY" ]; then
            echo "📱 Appetize URL: https://appet%20etize.io/app/$PUBLIC_KEY"
            echo "APPETIZE_URL=https://appetize.io/app/$PUBLIC_KEY" >> $GITHUB_ENV
          else
            echo "⚠️ Failed to get Appetize public key"
          fi

      - name: 💬 Comment PR with Appetize URL
        if: env.APPETIZE_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `📱 **App testable sur Appetize.io**\n\n${process.env.APPETIZE_URL}\n\n> Cliquez pour tester l'app dans votre navigateur`
            })

  # ──────────────────────────────────────────────────────────────────────
  # Job 5 : Summary
  # Résume les résultats de tous les jobs
  # ──────────────────────────────────────────────────────────────────────
  summary:
    name: 📋 Summary
    runs-on: ubuntu-latest
    needs: [verify-shared, build-android, build-ios]
    if: always()

    steps:
      - name: 📊 Generate Summary
        run: |
          echo "## 🏗️ SECT Mobile CI — Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Shared KMP | ${{ needs.verify-shared.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🤖 Android APK | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🍎 iOS App | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artefacts disponibles" >> $GITHUB_STEP_SUMMARY
          echo "- \`sect-android-release\` — APK signé (Android 8+, API 26+)" >> $GITHUB_STEP_SUMMARY
          echo "- \`sect-ios-simulator\` — .app simulateur (iOS 16+)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔑 Secrets GitHub requis" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`GOOGLE_SERVICES_JSON_B64\` | Firebase Android config (base64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`GOOGLE_SERVICE_INFO_PLIST_B64\` | Firebase iOS config (base64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANDROID_KEYSTORE_B64\` | Keystore release (base64) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANDROID_KEYSTORE_PASSWORD\` | Mot de passe keystore |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANDROID_KEY_ALIAS\` | Alias clé signing |" >> $GITHUB_STEP_SUMMARY
          echo "| \`ANDROID_KEY_PASSWORD\` | Mot de passe clé |" >> $GITHUB_STEP_SUMMARY
          echo "| \`APPETIZE_API_TOKEN\` | Token API Appetize.io (optionnel) |" >> $GITHUB_STEP_SUMMARY
