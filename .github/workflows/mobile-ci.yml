# SECT Mobile — CI/CD GitHub Actions
# Build and test the Kotlin Multiplatform module (Android + iOS)
#
# Triggers:
# - Changes in mobile/ → Compile Android + iOS + shared module
# - Changes in backend/ → Deploy Go on Render (auto)
# - Changes in frontend/ → Deploy Next.js on Vercel (auto)
#
# Jobs:
# 1. android  — Build Android APK + unit tests (ubuntu, JDK 17, Android SDK)
# 2. ios     — Build iOS shared framework + unit tests (macos, Xcode)
# 3. lint    — Run Detekt Kotlin linter (ubuntu, JDK 17)

name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Build & Test Android ──
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/.gradle
            mobile/androidApp/build
            mobile/shared/build
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-android-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build shared module
        working-directory: mobile
        run: ./gradlew :shared:build

      - name: Build Android app (debug APK)
        working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug

      - name: Run shared unit tests
        working-directory: mobile
        run: ./gradlew :shared:allTests || true  # Non-blocking for iOS simulator tests on Linux

      - name: Run Android unit tests
        working-directory: mobile
        run: ./gradlew :shared:testDebugUnitTest || true

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: sect-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: mobile/shared/build/reports/tests/
          retention-days: 3

  # ── Build iOS (shared framework only — macOS required) ──
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true
          xcodebuild -version

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/.gradle
            mobile/shared/build
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Build iOS framework (arm64)
        working-directory: mobile
        run: ./gradlew :shared:linkDebugFrameworkIosArm64

      - name: Build iOS framework (simulator arm64)
        working-directory: mobile
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run iOS unit tests
        working-directory: mobile
        run: ./gradlew :shared:iosSimulatorArm64Test || true

      - name: Upload iOS framework
        uses: actions/upload-artifact@v4
        with:
          name: sect-ios-shared-framework
          path: mobile/shared/build/bin/iosArm64/debugFramework/Shared.framework/
          retention-days: 7

  # ── Lint ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lint-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-lint-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x mobile/gradlew

      - name: Run Detekt (Kotlin linter)
        working-directory: mobile
        run: ./gradlew detekt || true  # Non-blocking in initial phase

      - name: Upload Detekt report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: mobile/shared/build/reports/detekt/
          retention-days: 3
