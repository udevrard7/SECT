# ============================================================
# SECT-REPLICA-1 — Phase 2 ADR-0013 §6 : POC réplication logique
# (base dédiée sect_replica sur le cluster DÉDIÉ 5433 — jamais
# mikcloud/18-main/5432).
#
# ⚠ RÈGLES drone-ssh (script_stop:true) — le plugin injecte
# « DRONE_SSH_PREV_COMMAND_EXIT_CODE=$? ; if [ … -ne 0 ]; then
# exit …; fi; » APRÈS CHAQUE LIGNE. Interdits donc :
#   - « case/esac » multiligne (garde injecté dans le corps →
#     erreur de syntaxe — run #38102728636) ;
#   - « else »/« elif » (le garde après le mot-clé else voit
#     $? = 1, le statut de la condition FAUSSE → exit SILENCIEUX
#     — runs #38104359312/#38104688451, prouvé par marqueurs) ;
#   → chaque condition = un « if … then … fi » SANS else ; les
#     if précédents sont des marqueurs « MARK n » pour diagnostic.
#
# Étapes (idempotentes) : clone (migrations) → binaire migrate
# (arm64) → base sect_replica → schéma golang-migrate (DSN local)
# → souscription sect_poc (DSN Neon lu DANS /opt/sect/.env) →
# état initial. Prérequis posés : wal_level=logical (setting
# PROJET Neon — irréversible), publication sect_poc (3 tables).
# ============================================================
name: Replica setup (phase 2 POC)

on:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.OCI_SSH_HOST }}" ] && [ -n "${{ secrets.OCI_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SSH secrets présents — setup activé"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "SSH secrets absents — setup impossible"
          fi

  setup:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Base sect_replica + schéma + souscription
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            PGB=/usr/lib/postgresql/18/bin
            PG() { sudo -n -u postgres "$PGB/$1" -p 5433 "${@:2}"; }

            echo "MARK 1 : clone du dépôt"
            TMP=$(mktemp -d /tmp/sect-replica-src.XXXXXX)
            git clone --depth 1 --quiet https://github.com/udevrard7/SECT.git "$TMP"
            chmod -R a+rX "$TMP"

            echo "MARK 2 : binaire golang-migrate"
            if [ ! -x /opt/sect/bin/migrate ]; then
              sudo mkdir -p /opt/sect/bin
              curl -fsSL -o /tmp/migrate.tgz https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-arm64.tar.gz
              sudo tar xzf /tmp/migrate.tgz -C /tmp migrate
              sudo install -m 0755 /tmp/migrate /opt/sect/bin/migrate
            fi
            /opt/sect/bin/migrate -version

            echo "MARK 3 : cluster dédié (listing complet ci-dessous)"
            pg_lsclusters 2>&1 || true
            CLUSTER_OK=$(pg_lsclusters 2>/dev/null | awk '$2=="sect" && $4=="online"{f=1} END{print f+0}' || true)
            if [ "$CLUSTER_OK" != "1" ]; then
              echo "ÉCHEC : cluster « sect » (5433) pas online — voir le listing ci-dessus"
              exit 1
            fi

            echo "MARK 4 : état actuel de sect_replica"
            DB_EXISTS=$(PG psql -d postgres -tAc "SELECT count(*) FROM pg_database WHERE datname='sect_replica'" | tr -d '[:space:]' || true)
            SUB_COUNT=0
            if [ "$DB_EXISTS" = "1" ]; then
              SUB_COUNT=$(PG psql -d sect_replica -tAc "SELECT count(*) FROM pg_subscription WHERE subname='sect_poc'" | tr -d '[:space:]' || true)
            fi

            if [ "$SUB_COUNT" = "1" ]; then
              echo "souscription déjà en place — schéma NON retouché (idempotence)"
            fi

            if [ "$SUB_COUNT" != "1" ]; then
              echo "MARK 5 : reconstruction propre (pas de souscription → sect_replica = scratch)"
              PG psql -d postgres -c "DROP DATABASE IF EXISTS sect_replica WITH (FORCE)"
              PG psql -d postgres -c "CREATE DATABASE sect_replica"
              sudo -n -u postgres /opt/sect/bin/migrate -path "$TMP/backend/db/db/migrations" -database "postgresql:///sect_replica?host=/var/run/postgresql&port=5433" up
              PG psql -d sect_replica -tAc "SELECT count(*) FROM pg_tables WHERE schemaname='public'" | xargs echo "tables public :"
            fi

            echo "MARK 6 : souscription sect_poc (DSN Neon lu sur la VM)"
            SUB_DSN="$(grep -E '^NEON_DIRECT_URL=' /opt/sect/.env | head -1 | cut -d= -f2-)"
            [ -n "$SUB_DSN" ] || { echo "ÉCHEC : NEON_DIRECT_URL introuvable dans /opt/sect/.env"; exit 1; }
            SUB_EXISTS=$(PG psql -d sect_replica -tAc "SELECT count(*) FROM pg_subscription WHERE subname='sect_poc'" | tr -d '[:space:]' || true)
            if [ "$SUB_EXISTS" != "1" ]; then
              PG psql -d sect_replica -c "CREATE SUBSCRIPTION sect_poc CONNECTION '$SUB_DSN' PUBLICATION sect_poc WITH (copy_data = true, create_slot = true, enabled = true)"
              echo "souscription sect_poc créée (copy_data initial en cours)"
            fi
            if [ "$SUB_EXISTS" = "1" ]; then
              echo "souscription sect_poc déjà présente"
            fi

            echo "MARK 7 : outillage sync programmée (ops/replica/, ADR §16)"
            sudo mkdir -p /opt/sect/replica
            sudo cp -r "$TMP/ops/replica/." /opt/sect/replica/
            sudo chmod 0755 /opt/sect/replica/sect_replica_sync.sh
            sudo install -m 0644 /opt/sect/replica/systemd/sect-replica-sync.service /etc/systemd/system/sect-replica-sync.service
            sudo install -m 0644 /opt/sect/replica/systemd/sect-replica-sync.timer /etc/systemd/system/sect-replica-sync.timer
            sudo systemctl daemon-reload
            sudo systemctl enable --now sect-replica-sync.timer
            systemctl list-timers 'sect-replica-sync' --no-pager || true
            echo "(le timer :02/:32 fermera la souscription en cours à la prochaine fenêtre)"

            echo "MARK 8 : attente copie initiale (30 s) puis état"
            sleep 30
            echo "── pg_subscription ──"
            PG psql -d sect_replica -c "SELECT subname, subenabled, subslotname, subpublications FROM pg_subscription"
            echo "── pg_stat_subscription ──"
            PG psql -d sect_replica -c "SELECT subname, pid, received_lsn, latest_end_lsn, latest_end_time FROM pg_stat_subscription"
            echo "── counts répliqués ──"
            echo -n "RequestLog : "
            PG psql -d sect_replica -tAc "SELECT count(*) FROM \"RequestLog\""
            echo -n "AuditLog : "
            PG psql -d sect_replica -tAc "SELECT count(*) FROM \"AuditLog\""
            echo -n "Reponse : "
            PG psql -d sect_replica -tAc "SELECT count(*) FROM \"Reponse\""
            sudo rm -rf "$TMP"
            echo "— fin du setup réplique (mesures : workflow « Replica status ») —"
