# ============================================================
# Workflow TEMPORAIRE (à supprimer après exécution) — SECT-NOTIF-TELEGRAM-1
# Application de la migration 000142 à la base Neon de production
# (le déploiement OCI ne déclenche PAS les migrations — leçon 000141).
#
# Méthode BIBLIO-10 : transaction ATOMIQUE
#   BEGIN; UPDATE schema_migrations SET dirty; <DDL 000142 + ASSERTs>;
#   UPDATE schema_migrations SET version=142, dirty=false; COMMIT;
# Un échec quelconque → ROLLBACK → base toujours clean à 141.
#
# ORDRE respecté (header de 000142) : le code a été déployé AVANT
# (commit 38515c5c, Deploy OCI ✓ run 40476017958) — l'ancien code
# cassait dès que User.instagram disparaissait (scanUser → 42703),
# le nouveau tolère l'absence des colonnes Telegram.
# ============================================================
name: Migrate 000142 (telegram)

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (fichier SQL 000142)
        uses: actions/checkout@v4

      - name: SQL 000142 en base64 (transféré via envs — contenu public du dépôt)
        run: echo "SQL_B64=$(base64 -w0 backend/db/db/migrations/000142_telegram_notif.up.sql)" >> "$GITHUB_ENV"

      - name: Apply 000142 + verify (SSH OCI)
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SQL_B64
          command_timeout: 10m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/sect/.env
            # NEON_DIRECT_URL = DSN owner (bypass RLS) — pattern BIBLIO-10.
            DSN=$(grep -E '^NEON_DIRECT_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$DSN" ]; then DSN=$(grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1 | cut -d= -f2-); fi

            echo "══ 0. SANTÉ / IMAGE DÉPLOYÉE (38515c5c attendu — migration APRÈS déploiement) ══"
            curl -s http://localhost:8090/health; echo
            docker inspect sect-api --format 'image={{.Config.Image}} startedAt={{.State.StartedAt}}'

            echo "══ 1. ÉTAT PRÉALABLE schema_migrations ══"
            psql "$DSN" -c 'SELECT version, dirty FROM schema_migrations;'
            VERSION=$(psql "$DSN" -At -c 'SELECT version FROM schema_migrations;')
            if [ "$VERSION" != "141" ]; then
              echo "ATTENDU version=141 (état pré-000142), trouvé $VERSION — ABORT (vérifier manuellement)."
              exit 1
            fi

            echo "══ 2. APPLICATION ATOMIQUE 000142 (dirty→DDL→clean) ══"
            printf '%s' "$SQL_B64" | base64 -d > /tmp/000142.up.sql
            wc -l /tmp/000142.up.sql
            cat > /tmp/000142.tx.sql <<'HDR'
            BEGIN;
            UPDATE schema_migrations SET version = 142, dirty = true;
            HDR
            cat /tmp/000142.up.sql >> /tmp/000142.tx.sql
            cat >> /tmp/000142.tx.sql <<'FTR'

            UPDATE schema_migrations SET version = 142, dirty = false;
            COMMIT;
            FTR
            psql "$DSN" -v ON_ERROR_STOP=1 -f /tmp/000142.tx.sql

            echo "══ 3. POST-VÉRIFICATIONS (ASSERTs déjà passés — recheck direct) ══"
            psql "$DSN" -c 'SELECT version, dirty FROM schema_migrations;'
            psql "$DSN" -c "SELECT table_name, column_name, data_type FROM information_schema.columns WHERE (table_name='User' AND column_name IN ('telegramChatId','telegramUsername')) OR (table_name='NotificationPreference' AND column_name='telegramEnabled');"
            psql "$DSN" -c "SELECT indexname, indexdef FROM pg_indexes WHERE indexname='User_telegramChatId_key';"
            psql "$DSN" -c "SELECT policyname, cmd FROM pg_policies WHERE tablename='User' AND policyname='User_update_system';"
            psql "$DSN" -At -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='User' AND column_name='instagram') THEN 'instagram ENCORE PRÉSENT (KO)' ELSE 'instagram retiré OK' END;"
            psql "$DSN" -At -c "SELECT CASE WHEN EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema='public' AND table_name='NotificationPreference' AND column_name='instagramEnabled') THEN 'instagramEnabled ENCORE PRÉSENT (KO)' ELSE 'instagramEnabled retiré OK' END;"

            echo "══ 4. ROUTES LIVE (comportements attendus SANS bot configuré) ══"
            curl -s -o /dev/null -w 'POST /api/telegram/webhook (sans secret): HTTP %{http_code} — 503 attendu\n' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8090/api/telegram/webhook
            curl -s -o /dev/null -w 'GET /api/telegram/link (sans auth): HTTP %{http_code} — 401 attendu\n' http://localhost:8090/api/telegram/link
            curl -s -o /dev/null -w 'PATCH /api/users/me (route self-service retirée): HTTP %{http_code} — 401/403 attendu\n' -X PATCH -H 'Content-Type: application/json' -d '{}' http://localhost:8090/api/users/me

            echo "══ 5. E2E JWT FORGÉ (étudiant réel — le secret n'est JAMAIS affiché) ══"
            SECRET=$(grep -E '^JWT_SECRET=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            ETU_ID=$(psql "$DSN" -At -c "SELECT id FROM \"User\" WHERE role='ETUDIANT' AND actif=true AND \"deletedAt\" IS NULL ORDER BY \"createdAt\" DESC LIMIT 1")
            if [ -n "$ETU_ID" ] && [ -n "$SECRET" ]; then
              b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
              NOW=$(date +%s); EXP=$((NOW + 600))
              HEADER=$(printf '{"alg":"HS256","typ":"JWT"}' | b64url)
              PAYLOAD=$(printf '{"sub":"%s","role":"ETUDIANT","etablissement_id":"","filiere_id":"","email":"","name":"","iat":%s,"exp":%s,"typ":"access","must_change_pwd":false}' "$ETU_ID" "$NOW" "$EXP" | b64url)
              SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" -binary | b64url)
              JWT="$HEADER.$PAYLOAD.$SIG"
              echo "── GET /api/me (ne doit PLUS contenir instagram, ne doit PAS 500) :"
              curl -s -H "Authorization: Bearer $JWT" http://localhost:8090/api/me | head -c 600; echo
              curl -s -H "Authorization: Bearer $JWT" http://localhost:8090/api/me | grep -q '"instagram"' && echo "KO : champ instagram encore présent" || echo "OK : champ instagram absent"
              echo "── GET /api/telegram/link (doit retourner enabled=false sans bot configuré) :"
              curl -s -H "Authorization: Bearer $JWT" http://localhost:8090/api/telegram/link; echo
            else
              echo "(étudiant actif ou secret absent — E2E JWT skippé)"
            fi

            echo "══ 6. LOGS RÉCENTS (erreurs SQL ?) ══"
            docker logs --since 5m sect-api 2>&1 | grep -iE 'error|erreur|42703|42883|panic' | tail -30 || echo "(aucune erreur récente)"

            echo "══ FIN — 000142 APPLIQUÉE ET VÉRIFIÉE ══"
