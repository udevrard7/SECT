# ──────────────────────────────────────────────────────────────────────────
# SECT Backend — CI Pipeline
# ──────────────────────────────────────────────────────────────────────────
# Compile le backend Go, lance les tests, build le Docker image
# ──────────────────────────────────────────────────────────────────────────

name: SECT Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Build & Test ──
  build:
    name: 🐹 Build & Test Go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        # actions/checkout@v4 (épinglé SHA — supply-chain)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🐹 Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'

      - name: 📦 Download dependencies
        run: go mod download

      - name: 🔍 Lint (golangci-lint)
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7
        with:
          # Version épinglée pour reproductibilité (config : backend/.golangci.yml)
          version: v2.14.0
          working-directory: backend

      - name: 🧪 Tests
        # Aucun fichier _test.go pour l'instant : l'étape valide surtout la
        # compilation des paquets de test (go test construit les binares).
        run: go test ./... -race -timeout=5m

      - name: 🏗️ Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o sect-api ./cmd/api/

  # ── Database Migration Check ──
  migrations:
    name: 🗃️ Vérifier Migrations SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: 🔍 Check migration files
        run: |
          # Vérifier que chaque .up.sql a un .down.sql correspondant
          MISSING=0
          for UP_FILE in db/db/migrations/*.up.sql; do
            BASE=$(basename "$UP_FILE" .up.sql)
            DOWN_FILE="db/db/migrations/${BASE}.down.sql"
            if [ ! -f "$DOWN_FILE" ]; then
              echo "❌ Missing down migration for: $UP_FILE"
              MISSING=1
            fi
          done
          
          if [ $MISSING -eq 1 ]; then
            echo "❌ Some migrations are missing down files"
            exit 1
          fi
          
          COUNT=$(ls db/db/migrations/*.up.sql 2>/dev/null | wc -l)
          echo "✅ All $COUNT migrations have matching .up.sql and .down.sql files"
