# ──────────────────────────────────────────────────────────────────────────
# SECT Frontend — CI Pipeline
# ──────────────────────────────────────────────────────────────────────────
# Next.js 16 — lint, test, build
# ──────────────────────────────────────────────────────────────────────────

name: SECT Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ⚡ Build Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: 🧪 Tests unitaires
        run: npm test -- --passWithNoTests || true

      - name: 🏗️ Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://sect-zead.onrender.com
