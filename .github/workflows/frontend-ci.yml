# ──────────────────────────────────────────────────────────────────────────
# SECT Frontend — CI Pipeline
# ──────────────────────────────────────────────────────────────────────────
# Next.js 16 — lint, test, build
# ──────────────────────────────────────────────────────────────────────────

name: SECT Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ⚡ Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bun (pas npm) : le projet frontend est géré avec bun (bun.lock).
      # L'ancien setup-node avec cache npm échouait car frontend/package-lock.json
      # n'existe pas → "unable to cache dependencies" → CI rouge à chaque run.
      # Version épinglée = celle validée localement (build Next.js 16 OK).
      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Lint
        run: bun run lint

      - name: 🧪 Tests unitaires
        # NOTE : plus de `|| true` — un échec de test doit faire rougir la CI.
        run: bun run test -- --passWithNoTests

      - name: 🏗️ Build Next.js
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: https://sect-zead.onrender.com
