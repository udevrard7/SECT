# ============================================================
# SECT-NOTIF-MIGRATE — Application de la migration 000141 à Neon
# (workflow TEMPORAIRE, à supprimer après exécution).
#
# Le déploiement OCI (bc3ecd01) embarque le code SECT-NOTIF-STUDENT-1
# qui SELECT User."instagram" — la migration 000141 DOIT être appliquée
# à Neon, sinon /api/me échoue en prod (colonne inexistante).
#
# Méthode BIBLIO-10 (prouvée) : transaction atomique
#   marquage dirty 141 → DDL + ASSERTs du .up.sql → marquage clean 141
# via NEON_DIRECT_URL (owner, hors pooler) sur la VM OCI.
#
# Post-vérifications : version=141 clean, colonnes présentes,
# fonctions v2 (lower+btrim), login par matricule insensible casse
# (repro SQL réelle sur un matricule existant), route PATCH /api/users/me
# vivante (401 sans auth), logs docker sans erreur /api/me.
# ============================================================
name: Migrate 000141 (notif+login)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: notif-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: "🗃️ Apply 000141 + verify (SSH OCI)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout (fichier SQL 000141)
        uses: actions/checkout@v4

      - name: Base64 du SQL (transfert vers la VM)
        run: |
          SQL_FILE=backend/db/db/migrations/000141_login_matricule_instagram.up.sql
          test -f "$SQL_FILE" || { echo "Fichier introuvable"; exit 1; }
          B64=$(base64 -w0 "$SQL_FILE")
          echo "len_b64=${#B64}"
          echo "SQL_B64=$B64" >> "$GITHUB_ENV"

      - name: SSH OCI — application + vérifications
        uses: appleboy/ssh-action@v1.2.5
        env:
          SQL_B64: ${{ env.SQL_B64 }}
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SQL_B64
          command_timeout: 10m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/sect/.env
            # NEON_DIRECT_URL = DSN owner (bypass RLS) — pattern BIBLIO-10.
            DSN=$(grep -E '^NEON_DIRECT_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$DSN" ]; then DSN=$(grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1 | cut -d= -f2-); fi

            echo "══ 0. SANTÉ / IMAGE DÉPLOYÉE ══"
            curl -s http://localhost:8090/health; echo
            docker inspect sect-api --format 'image={{.Config.Image}} startedAt={{.State.StartedAt}}'

            echo "══ 1. ÉTAT PRÉALABLE schema_migrations ══"
            psql "$DSN" -c 'SELECT version, dirty FROM schema_migrations;'
            VERSION=$(psql "$DSN" -At -c 'SELECT version FROM schema_migrations;')
            if [ "$VERSION" != "140" ]; then
              echo "ATTENDU version=140 (état pré-000141), trouvé $VERSION — ABORT (vérifier manuellement)."
              exit 1
            fi

            echo "══ 2. APPLICATION ATOMIQUE 000141 (dirty→DDL→clean) ══"
            printf '%s' "$SQL_B64" | base64 -d > /tmp/000141.up.sql
            wc -l /tmp/000141.up.sql
            cat > /tmp/000141.tx.sql <<'HDR'
            BEGIN;
            UPDATE schema_migrations SET version = 141, dirty = true;
            HDR
            cat /tmp/000141.up.sql >> /tmp/000141.tx.sql
            cat >> /tmp/000141.tx.sql <<'FTR'

            UPDATE schema_migrations SET version = 141, dirty = false;
            COMMIT;
            FTR
            psql "$DSN" -v ON_ERROR_STOP=1 -f /tmp/000141.tx.sql

            echo "══ 3. POST-VÉRIFICATIONS ══"
            psql "$DSN" -c 'SELECT version, dirty FROM schema_migrations;'
            psql "$DSN" -c "SELECT table_name, column_name, data_type FROM information_schema.columns WHERE (table_name='User' AND column_name='instagram') OR (table_name='NotificationPreference' AND column_name='instagramEnabled');"
            psql "$DSN" -At -c "SELECT CASE WHEN position('lower(btrim(' IN (SELECT pg_get_functiondef(oid) FROM pg_proc WHERE proname='find_user_for_auth' LIMIT 1)) > 0 THEN 'v2 OK' ELSE 'v2 MANQUANT' END;"
            psql "$DSN" -c "SELECT indexname FROM pg_indexes WHERE indexname IN ('User_matricule_lower_btrim_idx','User_email_lower_btrim_idx');"

            echo "══ 4. TEST LOGIN MATRICULE (insensible casse, SQL réel) ══"
            MAT=$(psql "$DSN" -At -c "SELECT \"matricule\" FROM \"User\" WHERE \"matricule\" IS NOT NULL AND \"deletedAt\" IS NULL LIMIT 1" || true)
            if [ -n "$MAT" ]; then
              echo "matricule réel trouvé — test lower()"
              psql "$DSN" -At -c "SELECT 'MATCH=' || count(*) FROM find_user_for_auth(lower('$MAT'))"
              psql "$DSN" -At -c "SELECT 'MATCH_SPACES=' || count(*) FROM find_user_for_auth('  $MAT  ')"
            else
              echo "aucun matricule en base — test identifier inexistant (0 attendu, pas d'erreur)"
              psql "$DSN" -At -c "SELECT 'MATCH=' || count(*) FROM find_user_for_auth('zz-inexistant')"
            fi

            echo "══ 5. ROUTES LIVE (401 attendus sans auth) ══"
            curl -s -o /dev/null -w 'PATCH /api/users/me (no auth): HTTP %{http_code}\n' -X PATCH -H 'Content-Type: application/json' -d '{"instagram":"x"}' http://localhost:8090/api/users/me
            curl -s -o /dev/null -w 'POST /api/auth/login (bad creds): HTTP %{http_code}\n' -X POST -H 'Content-Type: application/json' -d '{"identifier":"ETU-INEXISTANT","password":"wrongpass"}' http://localhost:8090/api/auth/login

            echo "══ 6. LOGS RÉCENTS (erreurs SQL ?) ══"
            docker logs --since 5m sect-api 2>&1 | grep -iE 'error|erreur|42703|42883|panic' | tail -30 || echo "(aucune erreur récente)"

            echo "══ FIN — 000141 APPLIQUÉE ET VÉRIFIÉE ══"
