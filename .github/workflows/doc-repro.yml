# ============================================================
# SECT-DOC-REPRO — Reproduction E2E de la panne /documents
# (workflow TEMPORAIRE, à supprimer après diagnostic).
#
# Forge un JWT de session enseignant SUR LA VM (JWT_SECRET lu dans
# /opt/sect/.env, jamais affiché), puis POSTe un TXT et un PDF réels
# sur localhost:8090/api/documents. Lit ensuite les logs docker (le
# fix d'observabilité MapDomainError trace désormais les 500), l'état
# DB (Document/Chapter) et l'activité du worker d'analyse.
#
# Lecture seule SAUF : l'upload de test (2 documents) + nettoyage par
# soft-delete via l'API (parcours utilisateur normal, purge corbeille
# standard 30 j).
# ============================================================
name: Repro /documents (upload réel)

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: doc-repro
  cancel-in-progress: false

jobs:
  repro:
    name: "🔁 Repro upload documents (SSH)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Génère le PDF de test (multi-pages, texte extractible)
        run: |
          python3 - <<'PY'
          def mkpdf(path):
              pages_text = [
                  ["SECT DIAGNOSTIC - Programmation Web - Seance 1",
                   "Chapitre 1 : Introduction au web et protocole HTTP.",
                   "Ce document sert au diagnostic de la chaine d'upload.",
                   "Il contient du texte extractible sur plusieurs pages."],
                  ["SECT DIAGNOSTIC - Programmation Web - Seance 2",
                   "Chapitre 2 : HTML, formulaires et accessibilite.",
                   "Chapitre 3 : CSS et mise en page responsive.",
                   "Fin du document de diagnostic, merci de votre attention."],
              ]
              objs = []
              page_ids = []
              # 1 catalog, 2 pages, fonts 3.., puis pages
              font_id = 3
              first_page = 4
              for i in range(len(pages_text)):
                  page_ids.append(first_page + i * 2)
              kids = " ".join(f"{pid} 0 R" for pid in page_ids)
              objs.append(b"1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n")
              objs.append(f"2 0 obj\n<< /Type /Pages /Kids [{kids}] /Count {len(page_ids)} >>\nendobj\n".encode())
              objs.append(b"3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n")
              for i, lines in enumerate(pages_text):
                  pid = page_ids[i]
                  cid = pid + 1
                  stream = "BT /F1 11 Tf 60 760 Td 16 TL\n"
                  for ln in lines:
                      stream += f"({ln}) Tj T*\n"
                  stream += "ET"
                  objs.append(f"{pid} 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents {cid} 0 R /Resources << /Font << /F1 3 0 R >> >> >>\nendobj\n".encode())
                  objs.append(f"{cid} 0 obj\n<< /Length {len(stream.encode())} >>\nstream\n{stream}\nendstream\nendobj\n".encode())
              out = b"%PDF-1.4\n"
              offsets = []
              for o in objs:
                  offsets.append(len(out))
                  out += o.encode() if isinstance(o, str) else o
              xref_pos = len(out)
              maxn = first_page + len(pages_text) * 2
              out += f"xref\n0 {maxn + 1}\n".encode()
              out += b"0000000000 65535 f \n"
              for off in offsets:
                  out += f"{off:010d} 00000 n \n".encode()
              out += f"trailer\n<< /Size {maxn + 1} /Root 1 0 R >>\nstartxref\n{xref_pos}\n%%EOF\n".encode()
              open(path, "wb").write(out)
              print("PDF bytes:", len(out))
          mkpdf("/tmp/sect-diag.pdf")
          PY
          ls -la /tmp/sect-diag.pdf
          # Sanity local : poppler sur le runner ? On teste juste la structure.
          head -c 60 /tmp/sect-diag.pdf; echo

      - name: Base64 du PDF (transfert vers la VM via GITHUB_ENV)
        run: |
          B64=$(base64 -w0 /tmp/sect-diag.pdf)
          echo "len_b64=${#B64}"
          echo "PDF_B64=$B64" >> "$GITHUB_ENV"

      - name: SSH OCI — repro complète
        uses: appleboy/ssh-action@v1.2.5
        env:
          PDF_B64: ${{ env.PDF_B64 }}
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: PDF_B64
          command_timeout: 10m
          script: |
            set -euo pipefail
            ENV_FILE=/opt/sect/.env
            # NEON_DIRECT_URL = DSN owner (bypass RLS) — nécessaire pour lire
            # les vraies lignes (le DSN runtime est RLS-scopé : sans claims,
            # les SELECT retournent 0 ligne — artefact constaté au 1er passage).
            DSN=$(grep -E '^NEON_DIRECT_URL=' "$ENV_FILE" | head -1 | cut -d= -f2-)
            if [ -z "$DSN" ]; then DSN=$(grep -E '^(NEON_DATABASE_URL|DATABASE_URL)=' "$ENV_FILE" | head -1 | cut -d= -f2-); fi
            SECRET=$(grep -E '^JWT_SECRET=' "$ENV_FILE" | head -1 | cut -d= -f2-)

            echo "══ 0. SANTÉ / VERSION DÉPLOYÉE ══"
            curl -s http://localhost:8090/health; echo
            docker inspect sect-api --format 'startedAt={{.State.StartedAt}}'

            echo "══ 1. ENSEIGNANT RÉEL (pour la fidélité du repro) ══"
            ROW=$(psql "$DSN" -At -F $'\t' -c "SELECT id, email, name FROM \"User\" WHERE role='ENSEIGNANT' AND \"deletedAt\" IS NULL ORDER BY \"createdAt\" LIMIT 1")
            if [ -z "$ROW" ]; then
              echo "aucun ENSEIGNANT — fallback ADMIN"
              ROW=$(psql "$DSN" -At -F $'\t' -c "SELECT id, email, name FROM \"User\" WHERE role='ADMIN' AND \"deletedAt\" IS NULL ORDER BY \"createdAt\" LIMIT 1")
            fi
            UID_=$(printf '%s' "$ROW" | cut -f1)
            EMAIL_=$(printf '%s' "$ROW" | cut -f2)
            NAME_=$(printf '%s' "$ROW" | cut -f3 | tr -d '"')
            ROLE_=$(psql "$DSN" -At -c "SELECT role FROM \"User\" WHERE id='$UID_'")
            echo "user=$EMAIL_ id=$UID_ role=$ROLE_"
            echo "— documents existants (tous propriétaires, via DSN owner) —"
            psql "$DSN" -c 'SELECT "id", "ownerId", "nomFichier", "statutAnalyse", left(coalesce("erreurAnalyse", chr(45)),130) AS err, ("contenuTexte" IS NOT NULL) AS has_text, "deletedAt" IS NOT NULL AS deleted, "createdAt" FROM "Document" ORDER BY "createdAt" DESC LIMIT 12;'

            echo "══ 2. JWT forgé localement (secret jamais affiché) ══"
            NOW=$(date +%s)
            HEADER=$(printf '{"alg":"HS256","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            PAYLOAD=$(printf '{"sub":"%s","role":"%s","etablissement_id":"","email":"%s","name":"%s","iat":%d,"exp":%d,"typ":"access","must_change_pwd":false}' "$UID_" "$ROLE_" "$EMAIL_" "$NAME_" "$NOW" "$((NOW + 900))" | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            SIG=$(printf '%s.%s' "$HEADER" "$PAYLOAD" | openssl dgst -sha256 -hmac "$SECRET" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
            TOKEN="$HEADER.$PAYLOAD.$SIG"

            echo "══ 3. GET /api/documents (sanity auth) ══"
            curl -s -o /tmp/get.json -w 'HTTP %{http_code}\n' -H "Cookie: access_token=$TOKEN" http://localhost:8090/api/documents
            head -c 200 /tmp/get.json; echo

            echo "══ 4. POST /api/documents — TXT ══"
            printf 'Document de diagnostic SECT.\nChapitre un : introduction aux variables et types.\nChapitre deux : structures de controle et boucles.\nChapitre trois : fonctions et tableaux.\nCe texte suffit pour une extraction et une analyse de demonstration.\n' > /tmp/sect-diag.txt
            curl -s -o /tmp/post_txt.json -w 'HTTP %{http_code} (%{time_total}s)\n' -H "Cookie: access_token=$TOKEN" -F "file=@/tmp/sect-diag.txt;type=text/plain" -F "userId=$UID_" http://localhost:8090/api/documents
            cat /tmp/post_txt.json; echo

            echo "══ 5. POST /api/documents — PDF ══"
            if [ -z "${PDF_B64:-}" ]; then echo "PDF_B64 absent — PDF skippé"; else
              printf '%s' "$PDF_B64" | base64 -d > /tmp/sect-diag.pdf
              ls -la /tmp/sect-diag.pdf
              curl -s -o /tmp/post_pdf.json -w 'HTTP %{http_code} (%{time_total}s)\n' -H "Cookie: access_token=$TOKEN" -F "file=@/tmp/sect-diag.pdf;type=application/pdf" -F "userId=$UID_" http://localhost:8090/api/documents
              cat /tmp/post_pdf.json; echo
            fi

            echo "══ 6. LOGS docker — 3 min (l'erreur 500 doit être tracée) ══"
            docker logs --since 3m sect-api 2>&1 | tail -80

            echo "══ 7. Attente worker IA (100 s) puis état DB ══"
            sleep 100
            docker logs --since 4m sect-api 2>&1 | grep -iE 'document|analy|chapter|error|erreur|IA|ai' | tail -60 || true
            psql "$DSN" -c 'SELECT "id", "nomFichier", "statutAnalyse", left(coalesce("erreurAnalyse", chr(45)),140) AS err, ("contenuTexte" IS NOT NULL) AS has_text, "createdAt" FROM "Document" WHERE "deletedAt" IS NULL ORDER BY "createdAt" DESC LIMIT 6;'
            psql "$DSN" -c 'SELECT d."nomFichier", count(c."id") AS chapters FROM "Document" d LEFT JOIN "Chapter" c ON c."documentId" = d."id" WHERE d."deletedAt" IS NULL GROUP BY d."id", d."nomFichier" ORDER BY d."createdAt" DESC LIMIT 6;'

            echo "══ 8. NETTOYAGE (soft-delete via l'API — parcours normal) ══"
            for ID in $(psql "$DSN" -At -c "SELECT id FROM \"Document\" WHERE \"nomFichier\" LIKE 'sect-diag%' AND \"deletedAt\" IS NULL"); do
              curl -s -o /dev/null -w "delete $ID: HTTP %{http_code}\n" -X DELETE -H "Cookie: access_token=$TOKEN" "http://localhost:8090/api/documents/$ID"
            done
            echo "══ FIN DE LA REPRO ══"
