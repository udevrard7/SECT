version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "db/queries/"
    schema:
      - "../../db/reference/schema.sql"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repository/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_empty_slices: true
