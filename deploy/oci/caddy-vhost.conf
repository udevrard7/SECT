# SECT-OCI-HYBRID-1 (corrigé §D.3 / SECT-OCI-DEPLOY-3) — vhost à AJOUTER
# au Caddy SYSTÈME de la VM (/etc/caddy/Caddyfile, celui de mikcloud),
# PAS un Caddyfile autonome : la VM n'expose qu'un seul caddy (prod).
#
# Installation (runbook §3.4) :
#   cat caddy-vhost.conf | sudo tee -a /etc/caddy/Caddyfile
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#
# Le conteneur sect-api écoute sur 127.0.0.1:8090 (deploy/oci/docker-compose.yml,
# API-only). TLS automatique Let's Encrypt dès que le DNS api.sect.ftci.fr
# existe (tant qu'il est NXDOMAIN, Caddy réessaie en arrière-plan et
# mikcloud continue de servir normalement).

api.sect.ftci.fr {
	encode gzip zstd

	# SSE + WebSocket : flush immédiat, connexions longues.
	reverse_proxy 127.0.0.1:8090 {
		flush_interval -1
		transport http {
			response_header_timeout 120s
		}
	}

	# Headers de sécurité (le backend pose les siens ; Caddy ajoute HSTS
	# car il termine le TLS).
	header {
		Strict-Transport-Security "max-age=31536000; includeSubDomains"
		-Server
	}

	request_body {
		# Documents de cours + énoncés — 100 Mo de marge.
		max_size 100MB
	}

	log {
		output stdout
		format console
	}
}
