# ============================================================
# SECT-OCI-HYBRID-1 (corrigé §D.3 / SECT-OCI-DEPLOY-3) — backend Go
# sur VM OCI Marseille (Ampere A1 ARM64) — instance PRIMAIRE.
#
# ⚠️ La VM n'est PAS vierge : elle héberge déjà mikcloud avec SON
# caddy SYSTÈME (api.mikcloud.ftci.fr → 127.0.0.1:4000) qui détient
# 80/443, plus postgresql@18-main local. Ce compose est donc API-ONLY :
#   - le conteneur publie 127.0.0.1:8090 (host) UNIQUEMENT ;
#   - le TLS public est assuré par le caddy SYSTÈME via le vhost
#     api.sect.ftci.fr → 127.0.0.1:8090 (deploy/oci/caddy-vhost.conf,
#     à ajouter à /etc/caddy/Caddyfile — runbook §3.4) ;
#   - NE JAMAIS lancer de conteneur caddy ici (conflit de ports avec
#     la prod mikcloud) ni toucher à caddy/postgresql@18-main.
#
# WORKERS_ENABLED vit dans /opt/sect/.env (PAS ici) : false pendant
# le bring-up (Render reste primaire — jamais d'actif-actif), basculé
# à true au cutover (runbook §3.6 : Render standby AVANT, OCI après).
#
# La VM exécute : cd /opt/sect && docker compose pull && docker compose up -d
# (déclenché par GitHub Actions — voir .github/workflows/deploy-oci.yml)
# ============================================================

services:
  api:
    image: ${API_IMAGE:-ghcr.io/udevrard7/sect/sect-api:latest}
    container_name: sect-api
    restart: unless-stopped
    env_file: /opt/sect/.env
    environment:
      - PORT=8080
      # WORKERS_ENABLED : volontairement ABSENT ici — gouverné par .env
      # (false au bring-up, true à la bascule §3.6).
    ports:
      # Localhost uniquement : seul le caddy système (mikcloud) parle à
      # l'API ; rien n'est exposé directement sur Internet.
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          # A1 4 vCPU / 24 Go PARTAGÉS avec mikcloud + postgres local
          # (~1 Go au repos) : borné large pour les workers IA
          # (docs, audio, corrections) en laissant ~4 Go au système.
          cpus: "3.5"
          memory: 20g
