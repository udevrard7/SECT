<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SECT Desktop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
    }
    /* Le webview charge SECT directement via un iframe plein écran.
       En Phase B, on remplacera par un webview natif (pas d'iframe). */
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
    /* Écran de chargement affiché avant que l'iframe ne charge SECT */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
      color: white;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loader .logo {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    #loader .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loader .text {
      margin-top: 1rem;
      font-size: 0.875rem;
      opacity: 0.9;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Écran de chargement -->
  <div id="loader">
    <div class="logo">SECT</div>
    <div class="spinner"></div>
    <div class="text">Chargement de la plateforme…</div>
  </div>

  <!-- SECT chargé dans une iframe plein écran.
       En Phase A : simple démonstration du webview.
       En Phase B : la communication se fera via window.go.sect.* (Wails bindings). -->
  <iframe
    id="sect-frame"
    src="https://sect-app.vercel.app"
    title="SECT — Système d'Évaluation Casse-Tête"
    allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"
    allowfullscreen
    onload="document.getElementById('loader').classList.add('hidden')"
  ></iframe>

  <!-- Bridge Wails : détecte si on tourne dans le webview Wails -->
  <script>
    // SECT-DESKTOP-PHASE-A-1 : bridge minimal.
    // window.go est injecté par Wails quand l'app tourne dans le webview.
    // Vérifie sa présence pour confirmer qu'on est bien dans le desktop.
    window.addEventListener('DOMContentLoaded', () => {
      const isDesktop = typeof window.go !== 'undefined' && !!window.go?.sect;
      console.log('[SECT Desktop] Wails bindings available:', isDesktop);
      if (isDesktop) {
        // Exemple : récupérer la version du desktop
        window.go.sect.GetAppVersion().then(version => {
          console.log('[SECT Desktop] App version:', version);
        });
        window.go.sect.GetBackendURL().then(url => {
          console.log('[SECT Desktop] Backend URL:', url);
        });
      }
    });
  </script>
</body>
</html>
